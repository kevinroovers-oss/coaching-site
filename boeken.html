 inz:["Wat niet gemeten wordt, bestaat niet in beleid: dataleemtes worden vanzelf beleidsleemtes.","'Genderneutraal' beleid pakt vaak mannelijk-gedefault uit: van roostering tot promotiecriteria rond zichtbaarheid.","Onbetaalde zorgarbeid is de grootste onzichtbare factor in loopbaanverschillen."],
 tips:["Splits je HR-data standaard uit naar geslacht (en andere assen): beloning, promotie, verloop, verzuim, opleidingsbudget.","Toets 'neutrale' criteria als beschikbaarheid, reisbereidheid en zichtbaarheid op hun ongelijke effect.","Betrek diverse gebruikers bij het ontwerp van elk nieuw proces of systeem — ook HR-systemen trainen op wie erin zit."],
 actie:"Draai vandaag één standaard HR-rapport opnieuw, uitgesplitst naar geslacht, en kijk wat je nog niet wist."},
{t:"The Second Machine Age",a:"Erik Brynjolfsson & Andrew McAfee",y:2014,c:"ai",
 kern:"Digitale technologie doet voor denkkracht wat de stoommachine deed voor spierkracht — maar exponentieel, digitaal en combinatorisch. De welvaart groeit, maar de verdeling schever: de kloof tussen winnaars en achterblijvers is het echte vraagstuk.",
 inz:["Exponentiële groei voelt lang als niets en dan ineens als alles: de tweede helft van het schaakbord.","Digitale goederen kosten bijna niets om te kopiëren; winner-takes-most-markten zijn het gevolg.","'Racing with the machine': de combinatie mens+machine verslaat lang zowel mens als machine alleen."],
 tips:["Investeer in vaardigheden die machines aanvullen: ideeënvorming, complexe communicatie, dealen met het onverwachte.","Herwaardeer functies periodiek: welke taken zijn stilletjes gedigitaliseerd en wat is het nieuwe menswerk?","Neem ongelijkheidseffecten mee in technologiebeslissingen: wie wint en wie verliest er intern bij deze automatisering?"],
 actie:"Vraag drie mensen in verschillende functies welk deel van hun werk vijf jaar geleden nog handwerk was — en trek de lijn vijf jaar door."},
{t:"The Coming Wave",a:"Mustafa Suleyman",y:2023,c:"ai",
 kern:"AI en synthetische biologie vormen een golf die zich, anders dan eerdere technologieën, nauwelijks laat indammen: goedkoop, alomtegenwoordig en autonoom. Het 'containment problem' — kunnen we deze technologie besturen? — is dé opgave van de komende decennia.",
 inz:["De verspreidingsprikkels (winst, prestige, veiligheid) maken 'gewoon niet doen' geen optie: golven laten zich niet tegenhouden, hooguit kanaliseren.","Techno-optimisme en doemdenken zijn beide vluchtgedrag; nodig is 'containment': techniek, audits, regulering en cultuur samen.","Naties en organisaties die de golf negeren, worden er niet door gespaard maar door verrast."],
 tips:["Ontwikkel als organisatie een expliciet AI-standpunt: wat doen we wel, wat niet, en wie bewaakt dat?","Bouw interne audit- en escalatieroutes voor AI-gebruik voordat incidenten je ertoe dwingen.","Volg regelgeving (zoals de EU AI Act) proactief; HR-toepassingen vallen vaak in de hoog-risicocategorie."],
 actie:"Check vandaag of je organisatie weet welke AI-tools medewerkers feitelijk al gebruiken — schaduwgebruik is je eerste governance-vraag."},
{t:"The Future of the Professions",a:"Richard Susskind & Daniel Susskind",y:2015,c:"ai",
 kern:"Professies — juristen, artsen, accountants, ook HR — bestaan bij de gratie van schaarse expertise. Technologie ontbundelt die expertise in routines, systemen en zelfbediening, waardoor het professionele monopolie langzaam maar zeker erodeert.",
 inz:["Professioneel werk blijkt bij decompositie grotendeels routiniseerbaar; het unieke restant is kleiner dan professionals denken.","Expertise migreert naar systemen: van adviseur naar architect van het systeem dat adviseert.","De vraag is niet of machines het werk van professionals overnemen, maar welke taken wanneer — en wie het systeem bezit."],
 tips:["Ontleed het werk van je HR-team in taken en markeer eerlijk wat een systeem of medewerker-zelfbediening kan overnemen.","Verschuif de professionele trots van 'ik beantwoord vragen' naar 'ik ontwerp het systeem dat vragen voorkomt'.","Investeer in de adviesvaardigheden die overblijven: complexe casuïstiek, ethiek, verandering."],
 actie:"Turf een week lang welke vragen HR binnenkrijgt en markeer vandaag alvast welk kwart een goede zelfbedieningspagina kan afvangen."},
{t:"Superagency",a:"Reid Hoffman & Greg Beato",y:2025,c:"ai",
 kern:"Tegenover doembeelden zet Hoffman 'superagency': AI als versterker van menselijke handelingskracht, zoals auto en internet dat eerder waren. De beste route is iteratieve uitrol — leren door miljoenen gebruikers — met mensen die zelf vormgeven hoe AI hun leven verbetert.",
 inz:["Elke grote technologie doorliep dezelfde paniekcyclus; uitsluiting van gebruik is riskanter dan begeleide adoptie.","Agency is het kompas: vergroot deze toepassing iemands mogelijkheden en keuzevrijheid, of verkleint ze die?","Mensen vertrouwen AI door hem te gebruiken, niet door erover te lezen — adoptie is een participatieproces."],
 tips:["Beoordeel AI-initiatieven op het agency-criterium: krijgen medewerkers er handelingsruimte bij of raken ze die kwijt?","Betrek medewerkers als mede-ontwerpers van AI-gebruik in hun eigen werk in plaats van tools op te leggen.","Ruim expliciet tijd in voor spelen en experimenteren; verbieden drijft gebruik ondergronds."],
 actie:"Vraag vandaag drie medewerkers waar AI hen meer regie zou geven over hun werk — en waar ze bang zijn regie te verliezen."},
{t:"Reinventing Jobs",a:"Ravin Jesuthasan & John Boudreau",y:2018,c:"ai",
 kern:"Automatisering is geen aan/uit-knop maar een ontwerpvraagstuk in vier stappen: ontleed de baan in taken, bepaal de opbrengstcurve per taak, kies de juiste automatiseringsvorm (RPA, cognitief, sociaal) en herontwerp dan het menselijke werk.",
 inz:["Per taak verschilt de vraag: vervangt technologie de mens, versterkt ze hem, of creëert ze nieuw werk?","De opbrengst van beter presteren verschilt per taak: bij sommige taken loont perfectie, bij andere volstaat foutloos.","Wie banen in taken denkt, ziet automatisering als continu herontwerp in plaats van periodieke reorganisaties."],
 tips:["Analyseer bij elk automatiseringsplan eerst: repetitief of variabel werk, onafhankelijk of interactief, fysiek of mentaal?","Herinvesteer vrijgekomen tijd expliciet: benoem wat het waardevollere menswerk wordt.","Herhaal de taakanalyse jaarlijks; AI-mogelijkheden verschuiven sneller dan functiebeschrijvingen."],
 actie:"Kies één functie in je organisatie en doorloop de vier stappen op één A4 — begin bij de taak, niet bij de tool."},
{t:"The Algorithmic Leader",a:"Mike Walsh",y:2019,c:"ai",
 kern:"Leiders in het algoritmische tijdperk denken vanuit de toekomst terug, ontwerpen voor het onverwachte en combineren computationeel denken met diep menselijke vaardigheden. Tien principes, van 'werk aan het systeem, niet in het systeem' tot 'als twijfel: vraag het een mens'.",
 inz:["Automatiseer taken, humaniseer banen: haal het robotwerk weg en vergroot het menselijke deel.","Wie alleen optimaliseert wat is, wordt ingehaald door wie herontwerpt wat kan zijn.","Ethische besluitvorming wordt een kernvaardigheid van leiders: algoritmes escaleren de dilemma's naar boven."],
 tips:["Stel bij elk vraagstuk de vraag: hoe zou een bedrijf dat vandaag start, dit met AI oplossen?","Ontwikkel 'computational thinking' in je MT: problemen ontleden, patronen zien, in systemen denken.","Reserveer leiderschapsagenda voor de vragen die algoritmes opwerpen maar niet kunnen beantwoorden: wat is hier rechtvaardig?"],
 actie:"Neem één proces waar je verantwoordelijk voor bent en beantwoord schriftelijk: hoe zou een greenfield-concurrent dit vandaag inrichten?"}
];

/* ============ hoofdstuk voor hoofdstuk ============
   gekeyed op boektitel; h = hoofdstuk/deel, s = samenvatting */
const CHAPTERS = {
"Work Rules!": [
{h:"1-2. Van oprichter tot cultuur", s:"Bock opent met de stelling dat iedereen zich oprichter van zijn eigen team kan voelen. Googles cultuur rust op drie pijlers: een betekenisvolle missie ('organiseer de wereldinformatie'), transparantie als standaard en echte inspraak van medewerkers in beslissingen die hen raken."},
{h:"3. Lake Wobegon: alleen de besten aannemen", s:"Werving is de belangrijkste people-activiteit die er is: het is makkelijker om iemand aan te nemen die al uitstekend is dan een gemiddelde medewerker naar dat niveau te ontwikkelen. Neem daarom alleen mensen aan die beter zijn dan jijzelf op een relevant vlak, en wacht liever langer dan de lat te verlagen."},
{h:"4-5. Zoeken en selecteren zonder onderbuik", s:"De beste kandidaten zoeken geen baan; bouw daarom een eigen sourcing-machine en gebruik referrals slim. In de selectie zelf: eerste indrukken voorspellen niets, gestructureerde interviews met vaste vragen en scoringsrubrieken wél. Combineer werkproeven, cognitieve tests en gestructureerde gesprekken; laat een panel beslissen, nooit de toekomstige manager alleen."},
{h:"6. Laat de gevangenen de gevangenis runnen", s:"Geef medewerkers meer vrijheid dan comfortabel voelt: haal managers uit beslissingen over aannemen, belonen en promoveren en leg die bij comités en data. Managers zijn er voor het faciliteren van het team, niet voor macht over individuen."},
{h:"7. Waarom iedereen beoordelingen haat", s:"Prestatiemanagement mislukt omdat het beoordelen en ontwikkelen in één gesprek propt. Google scheidt ze strikt: ontwikkelgesprekken doorlopend, beoordeling apart, gekalibreerd in groepen om beoordelaarsruis te dempen."},
{h:"8. De twee staarten", s:"De grootste winst zit in de uiteinden van de prestatieverdeling: leer van je beste presteerders (wat doen zij anders?) en help de onderkant serieus — de meesten blijken verkeerd geplaatst, niet onbekwaam. Van beide staarten leert de hele organisatie."},
{h:"9-10. Leren en oneerlijk belonen", s:"De beste leraren zitten al in huis: laat medewerkers elkaar onderwijzen en train alleen wat aantoonbaar gedrag verandert. En betaal 'oneerlijk': toppresteerders leveren veelvouden van het gemiddelde en mogen dus ook veelvouden verdienen — interne gelijkheid in beloning is schijnrechtvaardigheid."},
{h:"11-12. Gratis extraatjes en nudges", s:"De meeste geliefde voorzieningen kosten bijna niets: efficiëntie, gemeenschap en innovatie voor medewerkers. Gebruik nudges — standaardinstellingen, herinneringen, kleinere borden in het restaurant — om gezonde en verstandige keuzes makkelijk te maken zonder iets te verplichten."},
{h:"13-14. Als het misgaat + morgen beginnen", s:"Ook Googles experimenten mislukken soms publiekelijk; het antwoord is fouten toegeven, herstellen en doorgaan. Het boek sluit af met tien regels die elke organisatie morgen kan invoeren, van 'geef je werk betekenis' tot 'betaal oneerlijk' en 'meet en itereer'."}],
"Nine Lies About Work": [
{h:"Leugen 1. Mensen geven om welk bedrijf ze werken", s:"Mensen zeggen dat cultuur telt, maar hun dagelijkse ervaring wordt bepaald door hun team. Bedrijfscultuur is voor het cv, teamervaring voor het blijven: variatie in betrokkenheid zit vrijwel volledig tussen teams, niet tussen bedrijven."},
{h:"Leugen 2. Het beste plan wint", s:"Plannen verouderen sneller dan ze gemaakt worden. Winnende organisaties vervangen planning door intelligentie ter plekke: geef teams actuele, ruwe informatie en laat hen beslissen — een informatiesysteem verslaat een planningssysteem."},
{h:"Leugen 3. De beste bedrijven cascaderen doelen", s:"Gecascadeerde doelen worden theater: mensen herformuleren wat boven bedacht is. Wat echt richting geeft, is betekenis cascaderen — waarom het werk ertoe doet — en teams zelf doelen laten formuleren."},
{h:"Leugen 4. De beste mensen zijn allround", s:"Excellentie is idiosyncratisch: toppresteerders zijn scherp gepiekt, niet gebalanceerd. Competentiemodellen die iedereen op alles 'voldoende' willen, kweken middelmaat; bouw rollen rond iemands pieken."},
{h:"Leugen 5. Mensen hebben behoefte aan feedback", s:"Mensen hebben behoefte aan aandacht, niet aan oordelen over hun tekorten. Negatieve feedback triggert een verdedigingsreactie die leren remt; reageer op wat werkt ('dat! meer daarvan') en deel je eigen reactie in plaats van een oordeel."},
{h:"Leugen 6. Mensen kunnen anderen betrouwbaar beoordelen", s:"Het idiosyncratic rater effect: ruim de helft van de variantie in beoordelingen zegt iets over de beoordelaar, niet de beoordeelde. Vraag beoordelaars daarom naar hun eigen voorgenomen gedrag ('zou ik deze persoon altijd in mijn team willen?') in plaats van naar abstracte kwaliteiten van de ander."},
{h:"Leugen 7. Mensen hebben potentieel", s:"'Potentieel' als vast persoonskenmerk bestaat niet en high-potentiallijstjes zijn zelfvervullende voorspellingen. Iedereen heeft momentum — richting en snelheid in de huidige rol — en dat is wel zichtbaar en bespreekbaar."},
{h:"Leugen 8. Werk-privébalans is het belangrijkst", s:"Balans is een verliesframe: werk als iets dat gecompenseerd moet worden. Zoek in plaats daarvan liefde-in-het-werk: de activiteiten die energie geven ('rode draden') en weef daar bewust meer van in elke week."},
{h:"Leugen 9. Leiderschap is een ding", s:"Er is geen vaste lijst leiderschapskwaliteiten; er zijn alleen leiders mét volgers. Wat volgers bindt is diepe expertise ergens in, plus het vertrouwen dat deze persoon een levendige toekomst voor zich ziet."}],
"Drive": [
{h:"1. De opkomst en val van Motivatie 2.0", s:"Het industriële besturingssysteem — belonen wat je wilt, straffen wat je niet wilt — paste bij routinewerk maar loopt vast nu werk creatief en complex is. We draaien verouderde motivatiesoftware."},
{h:"2. Zeven redenen waarom wortel en stok vaak niet werken", s:"Als-dan-beloningen doven intrinsieke motivatie, verminderen prestaties bij denkwerk, doden creativiteit, verdringen goed gedrag, lokken vals spel uit, worden verslavend en kweken kortetermijndenken. Uitzondering: routinetaken, en dan nog met uitleg en erkenning."},
{h:"3. Type I en Type X", s:"Type X-gedrag draait op externe beloningen, Type I op de voldoening van de activiteit zelf. Type I presteert op termijn beter, is gezonder en is aan te leren — het is gedrag, geen karaktertrek."},
{h:"4. Autonomie", s:"Mensen willen sturing over de vier T's: hun taak, hun tijd, hun techniek en hun team. Voorbeelden als zelfgekozen projecten en resultaatgericht werken (ROWE) laten zien dat autonomie betrokkenheid en productiviteit verhoogt — management is de contraproductieve uitvinding."},
{h:"5. Meesterschap", s:"Meesterschap begint met flow maar vraagt meer: het zien van vaardigheid als ontwikkelbaar (mindset), bereidheid tot moeizaam oefenen (grit) en de acceptatie dat meesterschap een asymptoot is die je nooit helemaal bereikt — juist dat houdt het aantrekkelijk."},
{h:"6. Zingeving", s:"De zingevingsprikkel: winstmaximalisatie zonder purpose maakt organisaties én mensen ziek. Zet zingeving naast winst — in doelen, in woorden ('wij' in plaats van 'zij') en in beleid dat mensen dingen laat doen die ertoe doen."},
{h:"7. De Type I-toolkit", s:"Praktische oefeningen: geef jezelf een flow-test, formuleer je zin-in-één-vraag ('wat was mijn zin vandaag?'), doe een autonomie-audit in je team, en betaal ruim en eerlijk zodat geld van tafel is."}],
"Powerful": [
{h:"1. De grootste motivatie is bijdragen aan succes", s:"Vergeet motivatieprogramma's: mensen willen deel zijn van een winnend team dat betekenisvol werk doet met uitstekende collega's. Behandel ze als volwassenen en bouw je hele people-aanpak daaromheen."},
{h:"2. Elke medewerker moet het bedrijf snappen", s:"De beste vorm van empowerment is businesscontext: leer iedereen hoe het bedrijf geld verdient, wat de grootste uitdagingen zijn en hoe de concurrentie eruitziet. De heartbeat-communicatie moet zo sterk zijn dat elke medewerker de strategie kan navertellen."},
{h:"3. Mensen haten het om voorgelogen te worden", s:"Radicale eerlijkheid: zeg de waarheid over de business én over prestaties, face-to-face en op tijd. Anonieme feedbacksystemen ondermijnen juist vertrouwen; oefen het openlijk geven en ontvangen van kritiek."},
{h:"4. Debatteer stevig", s:"Vraag om meningen mét onderbouwing: laat mensen standpunten verdedigen op feiten, niet op overtuigingskracht of positie. Leer teams debatteren over de zaak en wijs mensen soms de andere kant toe om eigen bias te doorbreken."},
{h:"5. Bouw nu het bedrijf van straks", s:"Kijk zes maanden vooruit: welk team heb je dan nodig? Plan vanuit de toekomst in plaats van te bouwen op wie er toevallig zit, en accepteer dat sommige geweldige mensen niet meegroeien met wat het bedrijf wordt."},
{h:"6. In elke rol iemand die er uitstekend in is", s:"Talentdichtheid is geen luxe maar de kern: één matige speler verlaagt het niveau van iedereen. Werf gericht op wat de rol over een jaar vraagt en laat recruiters als businesspartners werken."},
{h:"7. Betaal wat mensen waard zijn voor jou", s:"Vergeet salarishuizen die op het verleden leunen: betaal top-of-market voor de mensen die het verschil maken, wees transparant over hoe beloning werkt en laat mensen gerust elders solliciteren — dat houdt je marktbeeld scherp."},
{h:"8. De kunst van goed afscheid nemen", s:"Als iemand niet meer past bij wat het bedrijf nodig heeft, is een respectvol en royaal afscheid volwassener dan eindeloze verbetertrajecten. Het team is geen familie maar een topsportteam: op elke plek de juiste speler voor deze wedstrijd."}],
"No Rules Rules": [
{h:"1. Talentdichtheid eerst", s:"Alles begint met een team van louter sterke spelers: prestaties zijn besmettelijk, en één middelmatige collega verlaagt aantoonbaar de kwaliteit en het moreel van de groep. Hastings leerde dit na noodgedwongen ontslagen die het bedrijf onverwacht béter maakten."},
{h:"2. Zeg wat je echt denkt (met positieve intentie)", s:"Hoge talentdichtheid maakt openhartige feedback mogelijk: alleen feedback geven met de intentie te helpen, concreet en bruikbaar, en de ontvanger waardeert of verwerpt hem bewust (de 4A's). Feedback loopt ook omhoog, juist naar de baas."},
{h:"3. Schrap controles: verlof, declaraties, goedkeuringen", s:"Met sterke mensen en veel openheid kunnen regels weg: onbeperkt verlof, 'handel in het belang van Netflix' als volledig declaratiebeleid. Vrijheid signaleert vertrouwen — en de zeldzame misbruiker wordt zichtbaar en aangepakt."},
{h:"4. Betaal de top van de markt", s:"Voor creatief werk geldt de rock-star-regel: de beste is niet twee keer maar tien keer beter. Betaal boven de markt, zonder bonussen (die versmallen denken), en moedig mensen aan hun marktwaarde te kennen."},
{h:"5. Open de boeken", s:"Deel gevoelige bedrijfsinformatie met iedereen: cijfers, strategie, zelfs aanstaande reorganisaties. 'Sunshining' — fouten en beslissingen openlijk bespreken — bouwt het vertrouwen dat radicale vrijheid mogelijk maakt."},
{h:"6. Geen besluitgoedkeuring nodig", s:"De geïnformeerde kapitein beslist: niet de baas, maar degene met de meeste kennis van zaken. Farm for dissent (haal actief tegenspraak op), test je idee, en als het mislukt: sunshine het en leer."},
{h:"7. De keeper's test", s:"Adequate prestaties krijgen een royale vertrekregeling: vraag je per teamlid af of je zou vechten om diegene te behouden. Het gaat om een topsportteam, geen familie — hard op prestaties, warm in de relatie."},
{h:"8. De feedbackcirkel", s:"Formele beoordelingen bestaan niet; in plaats daarvan live 360-sessies waarin teams elkaar rechtstreeks feedback geven. Dat vraagt oefening en veiligheid, maar houdt prestaties en relaties tegelijk scherp."},
{h:"9. Lead with context, not control", s:"Als de eerste stappen staan, kan de leider sturen met context: doelen, kaders en het waarom, waarna teams losjes gekoppeld ('highly aligned, loosely coupled') zelf beslissen. Het slothoofdstuk verkent hoe dit per landcultuur bijgesteld moet worden."}],
"Reinventing Organizations": [
{h:"Deel 1. De evolutie van organisatiemodellen", s:"Organisaties evolueerden in kleursprongen: rood (macht), amber (hiërarchie en processen, kerk en leger), oranje (prestatie en meritocratie, de moderne multinational), groen (waarden en stakeholders). Elke sprong loste problemen van de vorige op en creëerde nieuwe."},
{h:"Deel 1b. Teal: de volgende sprong", s:"Teal-organisaties zien zichzelf als levende systemen in plaats van machines. Drie doorbraken kenmerken ze: zelfsturing zonder managementlagen, heelheid (de hele mens is welkom) en een evolutief doel dat al luisterend wordt ontdekt."},
{h:"Deel 2. Zelfsturing in de praktijk", s:"Cases als Buurtzorg, FAVI en Morning Star laten de dragende structuren zien: kleine zelfsturende teams, het adviesproces (iedereen mag elk besluit nemen mits advies gevraagd aan betrokkenen en experts) en collegiale conflictresolutie in plaats van escalatie naar een baas."},
{h:"Deel 2b. Heelheid", s:"Praktijken die het professionele masker afbreken: check-ins, gespreksregels, aandacht voor emoties, kantoren die als thuis voelen. Veiligheid om jezelf te zijn maakt energie vrij die anders opgaat aan zelfbescherming."},
{h:"Deel 2c. People-praktijken opnieuw", s:"Werving door het team zelf, functioneringsgesprekken als peer-reflectie, zelf vastgestelde salarissen met peer-kalibratie, rollen in plaats van functies. HR verschuift van beheerser naar hoeder van processen die teams zelf uitvoeren."},
{h:"Deel 3. Voorwaarden voor emergentie", s:"Teal lukt alleen onder twee harde voorwaarden: de topleider én de eigenaren moeten het wereldbeeld echt omarmen. Daarna: start klein, verwacht chaos in de overgang en vertrouw op het zelforganiserend vermogen dat vrijkomt."}],
"Humanocracy": [
{h:"1-2. De bureaucratische belasting", s:"Bureaucratie is wereldwijd gegroeid, niet gekrompen: lagen, regels en stafafdelingen die initiatief smoren. Hamel en Zanini becijferen de 'bureaucratic mass index' en de miljarden aan verspild menselijk vermogen die erin verstopt zitten."},
{h:"3. Mensen boven bureaucratie", s:"Mensen zijn veerkrachtig en creatief; bureaucratieën zijn dat niet. De kernvraag van het boek: hoe bouw je organisaties die net zo buitengewoon zijn als de mensen erin — waar iedereen denkt en handelt als eigenaar?"},
{h:"4-5. Nucor en Haier", s:"Staalbedrijf Nucor haalt topproductiviteit met minimale hiërarchie, teambeloning en radicaal vertrouwen in de werkvloer. Haier splitste zichzelf op in 4.000 micro-ondernemingen met eigen klanten en eigen winst-en-verlies — bewijs dat het op schaal kan."},
{h:"6-12. De zeven principes", s:"Humanocracy rust op zeven principes: eigenaarschap (echte zeggenschap en meedelen in resultaat), markten (interne marktwerking boven planning), meritocratie (invloed volgt bewezen kunde, niet rang), gemeenschap, openheid, experimenteren en paradox (schijnbare tegenstellingen als vrijheid én discipline tegelijk omarmen)."},
{h:"13-14. Michelin en beginnen waar je bent", s:"Michelins 'responsabilisation' laat zien hoe een gevestigd concern stap voor stap autonomie naar fabrieksteams verplaatst. De les: wacht niet op de CEO — begin als 'activist van binnenuit' met experimenten in je eigen invloedssfeer en laat resultaten het pleidooi voeren."}],
"Redesigning Work": [
{h:"Stap 1. Begrijp wat er echt toe doet", s:"Begin met begrijpen: welke taken drijven productiviteit, wat hebben verschillende mensen nodig (levensfase, thuissituatie, persoonlijkheid), en welke netwerken en kennisstromen mogen niet breken? Zonder deze analyse is elk hybride beleid giswerk."},
{h:"Stap 2. Verbeeld nieuwe manieren van werken", s:"Doorbreek aannames: plaats én tijd zijn ontwerpvariabelen. Kantoor voor coöperatie, thuis voor focus, asynchroon voor tijdzones en energie. Gratton geeft voorbeelden van bedrijven die het kantoor herontwierpen tot ontmoetingsplek en de werkweek rond taken organiseerden."},
{h:"Stap 3. Modelleer en test", s:"Behandel herontwerp als experiment: formuleer hypotheses, test met pilotteams, meet effecten op productiviteit, verbinding en eerlijkheid. Let extra op onbedoelde ongelijkheid — wie promotie- en zichtbaarheidskansen verliest bij thuiswerken."},
{h:"Stap 4. Handel en creëer nieuw", s:"Veranker wat werkt in nieuwe normen en systemen: teamafspraken, vergaderdiscipline, beoordelen op output. Leiders moeten het nieuwe gedrag zichtbaar voorleven, anders wint de oude aanwezigheidscultuur het terug."}],
"The 100-Year Life": [
{h:"1-2. Leven en financiering", s:"Wie in de jaren tachtig of later geboren is, heeft een goede kans om ouder dan honderd te worden. De rekensom is hard: een pensioen van dertig jaar valt niet te financieren met veertig jaar werken — langer doorwerken is onvermijdelijk, dus moet werk anders."},
{h:"3. Het einde van het driefasenleven", s:"Leren-werken-pensioen kraakt onder de lengte van het leven. Via drie personages (Jack, Jimmy, Jane uit verschillende generaties) laten de auteurs zien hoe hetzelfde levenspad voor jongere generaties financieel en menselijk vastloopt."},
{h:"4-5. Immateriële bezittingen", s:"Naast geld heb je drie immateriële vermogens te onderhouden: productieve bezittingen (kennis, vaardigheden, reputatie), vitaliteit (gezondheid, vriendschappen, balans) en transformatievermogen (zelfkennis, divers netwerk, openheid voor verandering). Die vragen net als pensioen om bewust investeren."},
{h:"6-7. Scenario's en mogelijke zelven", s:"Meerfasige levens kennen nieuwe fases: verkenningsjaren, zelfstandig ondernemerschap, portfoliofases waarin betaald werk, zorg en leren mixen. Plannen wordt minder een blauwdruk en meer het openhouden van opties en experimenteren met mogelijke toekomstige identiteiten."},
{h:"8-9. Geld en tijd", s:"Financiële planning over een eeuw vraagt discipline én flexibiliteit; vrije tijd verschuift van louter recreatie naar her-creatie: investeren in jezelf. De vraag is niet hoeveel vrije tijd je hebt, maar waar die aan bijdraagt."},
{h:"10-11. De agenda voor werkgevers en overheid", s:"Bedrijven moeten af van het leeftijdsgebonden carrièrepad: flexibele in- en uitstroom, transities faciliteren, ervaring herwaarderen. Onderwijs en overheid moeten levenslang leren en flexibele pensioenen mogelijk maken — wie wacht, schuift het probleem naar de individuele medewerker."}],
"Work Without Jobs": [
{h:"1. Het nieuwe werk-besturingssysteem", s:"De vaste functie stamt uit de industriële standaardisatie en kraakt onder snelheid, schaarste en automatisering. Het alternatief: werk als stroom van taken en projecten, mensen als portfolio's van skills, en een systeem dat die twee continu matcht."},
{h:"2. Deconstructie van werk", s:"Ontleed functies in taken en analyseer per taak: repetitief of variabel, mentaal of fysiek, zelfstandig of interactief? Deze analyse onthult wat automatisering kan overnemen én welke menselijke taken meer waarde verdienen."},
{h:"3. De juiste mix van mens en machine", s:"Per taak kies je: vervangen (RPA voor repetitief werk), versterken (AI die de professional beter maakt) of nieuw menselijk werk creëren. Automatisering wordt zo een ontwerpbeslissing per taak in plaats van een reorganisatie per functie."},
{h:"4. Vast, flex en alles ertussen", s:"Gedeconstrueerd werk kan naar meer werkvormen stromen: eigen mensen via een talentmarktplaats, gig-workers, uitbesteding, allianties. De vraag verschuift van 'wie nemen we aan?' naar 'hoe krijgt dit werk de beste bezetting?'"},
{h:"5. De interne talentmarktplaats", s:"Cases (o.a. Unilever) tonen platforms waar medewerkers naast hun rol op projecten intekenen. Effect: verborgen skills worden zichtbaar, ontwikkeling versnelt, verloop daalt — mits managers hun mensen durven 'delen'."},
{h:"6. De transitie", s:"Begin niet met een big bang maar bij knelpunten: schaarse rollen, automatiseringsplannen, piekwerk. Bouw stapsgewijs de nieuwe gewoontes (werk in taken denken, skills registreren) en laat het oude functiesysteem geleidelijk los."}],
"The Skills-Powered Organization": [
{h:"1. Waarom skills de nieuwe valuta zijn", s:"Drie krachten maken het functiegebouw onhoudbaar: AI die taken herverdeelt, chronische talentschaarste en werknemers die ontwikkeling eisen. Organisaties die in skills denken, kunnen werk sneller herverdelen dan wie in vacatures denkt."},
{h:"2. De fundamenten", s:"Een skills-based organisatie vraagt drie bouwstenen: een gedeelde skillstaxonomie (dezelfde taal), een actueel beeld van aanwezige skills (vaak AI-ondersteund afgeleid uit werk en ontwikkeling) en werk dat in skills is uitgedrukt in plaats van in functie-eisen."},
{h:"3. Talentprocessen opnieuw ontworpen", s:"Werving zonder onnodige diploma-eisen, interne mobiliteit via skills-matching, leren gekoppeld aan skillsgaps, beloning die schaarse skills reflecteert. Elk HR-proces wordt herbouwd rond de vraag: wat kan iemand, en wat kan diegene leren?"},
{h:"4. Cases uit de praktijk", s:"Onder meer Standard Chartered (Kapilashrami's eigen bank) laat zien hoe een talentmarktplaats plus skillsdata duizenden interne moves mogelijk maakte. De rode draad: start bij bedrijfskritische, schaarse rollen en laat succes de uitrol trekken."},
{h:"5. Leiderschap en cultuur", s:"De transitie is vooral cultureel: managers moeten talent zien als organisatiebezit in plaats van teambezit, en medewerkers moeten eigenaarschap over hun ontwikkeling durven nemen. Transparantie over skills en kansen is de smeerolie."},
{h:"6. De routekaart", s:"Een gefaseerd pad: kies een urgent talentprobleem, bouw de minimale skillstaal, experimenteer met matching, meet en schaal op. Perfectie in de taxonomie is de vijand van beginnen."}],
"Irresistible": [
{h:"1. Teams, niet hiërarchie", s:"Werk gebeurt in kleine, multidisciplinaire teams; de hark is hooguit administratie. Onweerstaanbare bedrijven geven teams doelen en autonomie, en meten teamgezondheid in plaats van individuele compliance."},
{h:"2. Werk, niet banen", s:"Mensen willen betekenisvol werk dat past bij hun sterktes, niet een functieomschrijving. Ontwerp werk rond klantwaarde, geef ruimte om de rol te kneden (job crafting) en houd het werk zelf doenbaar — dat is de kern van employee experience."},
{h:"3. Coach, niet baas", s:"De leidinggevende van nu haalt obstakels weg, stelt vragen en ontwikkelt mensen. Bersin laat zien dat bedrijven die managers selecteren en trainen als coach structureel hogere betrokkenheid en betere resultaten halen."},
{h:"4. Cultuur, niet regels", s:"Gedrag wordt gestuurd door gedeelde waarden en voorbeeldgedrag, niet door dikke handboeken. Vertrouwen, transparantie en inclusie zijn de cultuurdragers; regels zijn er alleen waar ze echt risico's afdekken."},
{h:"5. Groei, niet promotie", s:"In platte organisaties is omhoog schaars; groei zit in nieuwe skills, projecten en laterale stappen. Faciliteer interne mobiliteit en continu leren, en vier vakmanschap net zo hard als leidinggeven."},
{h:"6. Purpose, niet winst", s:"Zingeving is de sterkste bindende kracht: bedrijven met een geleefde missie presteren beter op retentie en klanttevredenheid. Purpose moet terugkomen in besluiten, niet alleen in de missietekst."},
{h:"7. Employee experience, niet output alleen", s:"Meet en verbeter de hele medewerkerreis — van solliciteren tot vertrek — zoals je klantreizen verbetert. Luister continu (surveys, gesprekken, data) en behandel irritaties in het werk als productdefecten die je oplost."}],
"Redefining HR": [
{h:"1. Van personnel naar people", s:"HR ontwikkelde zich van administratie via businesspartner naar productteam voor de medewerkerervaring. Moderne people-teams ontlenen gezag aan businessimpact en bouwen ervaring als een product, met medewerkers als gebruikers."},
{h:"2. Cultuur en waarden als operationeel systeem", s:"Cultuur is wat je beloont, tolereert en voorleeft. Schmidt laat via voorbeelden zien hoe scale-ups waarden operationaliseren in werving, feedback en besluitvorming — en hoe snel cultuur ontspoort als leiders er zelf van afwijken."},
{h:"3. Werving als vak", s:"De beste teams behandelen recruitment als product- en datavraagstuk: kandidaat-ervaring, gestructureerde interviews, diverse pijplijnen, employer brand op basis van de echte cultuur — geen gepolijst wervingspraatje."},
{h:"4. Diversiteit, gelijkwaardigheid en inclusie", s:"DEI is systeemwerk, geen training: kijk naar beloningsgelijkheid, promotiestatistieken en wie er vertrekt. Meet, publiceer en herontwerp processen; intenties zonder data blijven pr."},
{h:"5. People analytics en technologie", s:"Data verschuift HR van mening naar bewijs: verloopanalyses, betrokkenheidsdrivers, wervingsfunnels. Kies technologie die de ervaring verbetert in plaats van bureaucratie digitaliseert, en bewaak privacy en ethiek actief."},
{h:"6. De moderne HR-professional", s:"Het vak vraagt nieuwe profielen: analytisch, communicatief, businesswise, techvaardig. Bouw je eigen ontwikkeling zoals je die van de organisatie bouwt — via netwerk, open playbooks en schaamteloos lenen van anderen."}],
"HR Disrupted": [
{h:"1. Waarom HR vastloopt", s:"HR is ontworpen voor een wereld van controle en uniformiteit: beleid voor de 5% probleemgevallen, processen die niemand mooi vindt, en HR als politieagent. Het resultaat: medewerkers voelen zich gewantrouwd en HR wordt niet serieus genomen."},
{h:"2. EACH: medewerkers als volwassenen", s:"Behandel mensen als Adults: geef vertrouwen als uitgangspunt, schrap infantiliserende regels en leg verantwoordelijkheid terug. Volwassen behandeld worden is de basis van eigenaarschap."},
{h:"3. EACH: medewerkers als consumenten", s:"Denk als marketeer: segmenteer je medewerkers, personaliseer arbeidsvoorwaarden en ontwikkelpaden, en ontwerp ervaringen in plaats van processen. One-size-fits-all is voor niemand passend."},
{h:"4. EACH: medewerkers als mensen", s:"Erken emoties, levensfases en het leven buiten werk. Rituelen, aandacht bij overgangen (geboorte, verlies, ziekte) en menselijke communicatie doen meer voor binding dan welk benefit ook."},
{h:"5. Het anders doen", s:"Begin met experimenten in plaats van blauwdrukken: pilot een nieuwe aanpak, meet, en schaal wat werkt. Neem leiders mee door hun eigen frustraties over HR-processen als startpunt te gebruiken."}],
"Bullshit Jobs": [
{h:"1. Wat is een bullshitbaan?", s:"Een bullshitbaan is werk dat zelfs de uitvoerder heimelijk zinloos of schadelijk vindt, maar dat wel serieus verdedigd moet worden. Graeber onderscheidt dit scherp van rotbanen: zwaar maar nuttig werk. Peilingen suggereren dat een flink deel van de werkenden de eigen baan als maatschappelijk overbodig ervaart."},
{h:"2. De vijf soorten", s:"Flunkies (bestaan om iemand belangrijk te laten lijken), goons (agressief werk dat alleen bestaat omdat de concurrent het ook heeft), duct tapers (repareren wat structureel kapot is), box tickers (rapportage die doet alsof er iets gebeurt) en taskmasters (werk verdelen dat zichzelf zou verdelen)."},
{h:"3-4. Geestelijk geweld", s:"Zinloos werk beschadigt mensen: het botst met de menselijke behoefte om effect te hebben op de wereld. Het gevolg is een mengsel van verveling, schaamte en cynisme — erger dan hard werken, omdat je er niet trots op kunt zijn."},
{h:"5. Waarom het woekert", s:"Managerialisme werkt als moderne leenheerlijkheid: status wordt afgemeten aan de omvang van je staf, dus groeien staven. Rapportage- en compliance-lagen voeden zichzelf, en niemand heeft belang bij het opheffen van zijn eigen functie."},
{h:"6-7. De waarde van werk en wat te doen", s:"We betalen paradoxaal het minst voor het nuttigste werk (zorg, onderwijs) en het meest voor werk waarvan het nut betwist is. Graebers politieke antwoord (basisinkomen) is discutabel, maar zijn diagnose voor organisaties is direct bruikbaar: snoei rapportagelagen en maak bijdrage zichtbaar."}],
"Out of Office": [
{h:"1. Flexibiliteit", s:"Echte flexibiliteit is zeggenschap over wanneer en waar je werkt — niet thuiswerken met dezelfde vergaderdruk. Zonder expliciete grenzen wordt flexibiliteit een eufemisme voor altijd bereikbaar; bedrijven moeten normen stellen, niet alleen opties bieden."},
{h:"2. Cultuur", s:"Cultuur ontstaat niet vanzelf op afstand: wat op kantoor impliciet ging (leren door afkijken, informele checks), moet expliciet ontworpen worden. Documenteer normen, maak onboarding doelbewust en waak voor een tweedeling tussen kantoor- en thuiswerkers."},
{h:"3. Technologie van het kantoor", s:"Tools importeren stilletjes kantoorlogica: chat hersteld de onderbrekingscultuur, video de vergadercultuur. Kies bewust voor asynchroon: schrijven, documenteren en reactietermijnen — technologie moet tijd teruggeven, niet opslokken."},
{h:"4. Gemeenschap", s:"Als werk minder levensvullend wordt, ontstaat ruimte voor gemeenschap buiten werk: buurt, vrijwilligerswerk, zorg. De auteurs zien dat als de eigenlijke belofte van flexibel werken — een voller leven, en paradoxaal genoeg ook duurzamere werknemers."}],
"Remote: Office Not Required": [
{h:"1. De tijd is rijp", s:"Kantoorwerk is één lange reeks onderbrekingen; het echte werk gebeurt vaak vroeg, laat of thuis. Remote werken geeft de beste uren van de dag terug en opent de talentvijver van de hele wereld."},
{h:"2. Excuses ontkracht", s:"Alle klassieke bezwaren — 'thuis lummelen mensen', 'we verliezen cultuur', 'veiligheid' — worden stuk voor stuk weerlegd. De kern: wie mensen op afstand niet vertrouwt, heeft een wervingsprobleem of een managementprobleem, geen locatieprobleem."},
{h:"3. Samenwerken op afstand", s:"Zorg voor enkele uren overlap per dag, deel werk zichtbaar (alles digitaal en vindbaar), en vervang vergaderingen door geschreven communicatie. De virtuele watercooler en periodieke fysieke ontmoetingen houden de band warm."},
{h:"4. Pas op voor de draken", s:"De echte risico's van remote zijn niet luiheid maar overwerk, isolement en cabinekoorts. Managers moeten letten op wie te véél werkt, en routines aanmoedigen die werk en privé scheiden."},
{h:"5. Mensen aannemen en managen", s:"Werf op schrijfvaardigheid en zelfstandigheid, beoordeel op opgeleverd werk, en betaal niet minder omdat iemand elders woont. Voor managers: stuur op output, wees zelf bereikbaar en verwijder blokkades — micromanagement werkt op afstand nog slechter."}],
"Deep Work": [
{h:"1. Deep work is waardevol", s:"In de kenniseconomie winnen wie snel moeilijke dingen leren en wie op topniveau produceren — beide vragen geconcentreerd, onafgeleid werk. Wie dat kan, is schaars op een arbeidsmarkt vol oppervlakkige drukte."},
{h:"2. Deep work is zeldzaam", s:"Open kantoren, chat en 'altijd bereikbaar' maken diep werk structureel onmogelijk, terwijl drukte als proxy voor productiviteit dient. Organisaties meten wat makkelijk meet (respons, aanwezigheid) in plaats van wat waarde schept."},
{h:"3. Deep work is betekenisvol", s:"Concentratie maakt niet alleen productiever maar ook gelukkiger: aandacht bepaalt de kwaliteit van je ervaring, en vakmanschap geeft zin. Diep werk is dus ook een welzijnsstrategie."},
{h:"Regel 1. Werk diep", s:"Kies een filosofie (van kloosterlijk tot journalistiek inplannen), bouw rituelen (vaste tijd, plek, regels), werk met de 4DX-discipline (focus op wildly important goals, meet lead measures) en sluit de dag af met een shutdown-ritueel."},
{h:"Regel 2. Omarm verveling", s:"Concentratie is een spier die je sloopt door elke wachtrij met je telefoon te vullen. Plan juist je afleiding (internetblokken) en train productief mediteren: één probleem doordenken tijdens wandelen of sporten."},
{h:"Regel 3. Wees kritisch op sociale media", s:"Pas de vakman-benadering toe: gebruik een tool alleen als de voordelen de nadelen wezenlijk overtreffen voor jouw kerndoelen. Niet 'het levert wel eens iets op' — dat doet alles."},
{h:"Regel 4. Dam het oppervlakkige in", s:"Plan elke minuut van je dag (en herplan gerust), kwantificeer de diepte van taken, zeg vaker nee en word moeilijker bereikbaar. Oppervlakkig werk is onvermijdelijk, maar het hoort in de marges van de dag, niet in het hart."}],
"A World Without Work": [
{h:"Deel 1. De context", s:"Al tweehonderd jaar voorspellen mensen technologische werkloosheid en steeds ontstond er nieuw werk. Susskind legt uit waarom: technologie verving taken maar versterkte de vraag naar andere menselijke taken — het complementariteitseffect hield de arbeidsmarkt overeind."},
{h:"Deel 2a. Waarom dit keer anders is", s:"De 'pragmatistische revolutie': AI hoeft menselijk denken niet na te bootsen, alleen uitkomsten te leveren via data en rekenkracht. Daardoor rukt 'task encroachment' op in steeds meer domeinen — ook cognitief en creatief werk dat veilig leek."},
{h:"Deel 2b. Frictie- en structurele werkloosheid", s:"Het probleem komt in fases: eerst mismatch (verkeerde vaardigheden en plekken), daarna mogelijk structureel tekort aan vraag naar menselijk werk. Omscholing helpt tegen het eerste, niet vanzelf tegen het tweede."},
{h:"Deel 3a. De grote staat", s:"Als de arbeidsmarkt inkomen niet meer eerlijk verdeelt, moet herverdeling anders: belasting op kapitaal in plaats van arbeid, en een vorm van gedeeld eigendom van technologische welvaart. Susskind bepleit een voorwaardelijk basisinkomen boven een onvoorwaardelijk."},
{h:"Deel 3b. Big tech en macht", s:"Naast economische macht groeit politieke macht van techbedrijven: wie de systemen bezit, bepaalt spelregels. Toezicht moet zich verbreden van marktmacht naar maatschappelijke macht."},
{h:"Deel 3c. Zingeving zonder werk", s:"Als werk minder centraal staat, moet zin ergens anders vandaan komen: zorg, gemeenschap, ontwikkeling. Voor organisaties nu al relevant: bouw identiteit niet uitsluitend op de baan, en begeleid mensen bij transities."}],
"The Geek Way": [
{h:"1-2. De geek way en cultuurevolutie", s:"Snelgroeiende techbedrijven presteren niet door slimmere mensen maar door slimmere culturele normen. McAfee grondt dit in cultuurevolutie: groepen leren via imitatie en status, dus wie de statusregels goed zet, krijgt snel lerende organisaties."},
{h:"3. Wetenschap", s:"De norm: beweringen winnen door bewijs, niet door rang of welsprekendheid. Praktisch: A/B-testen, data boven meningen, en discussies die eindigen met een experiment in plaats van met de hoogste in rang."},
{h:"4. Eigenaarschap", s:"Kleine teams met volledige verantwoordelijkheid voor een afgebakend stuk, minimale afhankelijkheden en weinig verplichte coördinatie. Bureaucratie is het sluipende alternatief: iedereen mag meepraten, niemand is eigenaar."},
{h:"5. Snelheid", s:"Itereren verslaat plannen: lever klein en vaak, faal goedkoop en leer hardop. Grote waterval-projecten falen stil en duur; snelle feedbackloops houden de organisatie eerlijk."},
{h:"6. Openheid", s:"Slecht nieuws moet sneller reizen dan goed nieuws: psychologische veiligheid, tegenspraak en het vieren van de brenger van problemen. Defensiviteit en gladde presentaties zijn de dood van leren."},
{h:"7. Tegen de netjesheid", s:"De grootste vijand van de geek way is 'liar's club'-gedrag: statusspel, indekken, mooi weer spelen. De vier normen houden elkaar overeind — wie er één laat vallen, verliest ze uiteindelijk allemaal."}],
"The Fearless Organization": [
{h:"1. De basis", s:"Psychologische veiligheid is het gedeelde geloof dat interpersoonlijk risico — vragen stellen, fouten melden, twijfel uiten — hier veilig is. Het is geen aardigheid of verlaagde lat, maar de voorwaarde waaronder teams kennis echt benutten. Edmondson ontdekte het toen betere ziekenhuisteams méér fouten leken te maken: ze rapporteerden ze alleen vaker."},
{h:"2. Het onderzoeksspoor", s:"Decennia onderzoek — inclusief Googles Project Aristotle — wijzen psychologische veiligheid aan als de sterkste voorspeller van teameffectiviteit. Veiligheid en prestatienormen zijn twee assen: hoog-hoog is de leerzone, hoog-laag de comfortzone, laag-hoog de angstzone."},
{h:"3. Vermijdbaar falen", s:"Cases als Volkswagen (dieselschandaal) en Wells Fargo laten zien hoe angstculturen fraude en stilte produceren: onhaalbare targets plus afstraffing van slecht nieuws dwingen mensen tot bedrog of zwijgen."},
{h:"4. Gevaarlijke stilte", s:"Bij rampen als de Columbia-shuttle wist iemand het, maar zweeg of werd niet gehoord. Stilte voelt altijd veiliger dan spreken; de organisatie moet die asymmetrie actief omkeren, want de kosten van stilte zijn onzichtbaar tot het te laat is."},
{h:"5. De onbevreesde werkplek", s:"Positieve voorbeelden — Pixars braintrust, Bridgewaters radicale transparantie, Barry-Wehmillers mensgerichte fabrieken — tonen dat openhartigheid georganiseerd kan worden, elk in een eigen stijl maar steeds met leiders die zelf kwetsbaarheid voorleven."},
{h:"6. Veilig én veeleisend", s:"Veiligheid vervangt de lat niet, hij maakt hem haalbaar: het doel is 'ik mag alles zeggen' gecombineerd met 'we verwachten hier excellentie'. Zonder standaarden wordt veiligheid comfort; zonder veiligheid worden standaarden angst."},
{h:"7. De toolkit van de leider", s:"Drie stappen: kader het werk als leer- en onzekerheidsprobleem (dan zijn fouten informatie), nodig actief uit (echte vragen, luisterstructuren) en reageer productief (waardeer de melding, ook als de boodschap pijn doet). Plus antwoorden op veelgestelde vragen: veiligheid bouwen kost jaren, slopen kost één slechte reactie."}],
"The Culture Code": [
{h:"1. Veiligheid opbouwen", s:"Kleuters verslaan MBA-studenten in de spaghetti-toren omdat ze zonder statusspel samenwerken. Sterke groepen wisselen continu 'belonging cues' uit: nabijheid, oogcontact, beurtwisseling, aandacht. Veiligheid is geen gevoel maar een stroom signalen die zegt: jij hoort erbij, dit is veilig, we hebben een toekomst samen."},
{h:"2. Veiligheid ontwerpen", s:"Leiders als Popovich (Spurs) en bedrijven als Zappos bouwen belonging bewust: overdreven veel dank en aandacht, botsingen creëren tussen mensen, iedereen een stem geven. Kleine dingen — samen eten, de leider die luistert — wegen zwaarder dan grote woorden."},
{h:"3. Kwetsbaarheid delen", s:"De kwetsbaarheidslus: als één iemand (bij voorkeur de leider) openlijk zegt 'ik weet het niet, help me', volgt de groep. Samenwerking ontstaat niet uit vertrouwen maar andersom: gedeelde kwetsbaarheid creëert vertrouwen. Navy SEALs trainen dit met after-action reviews zonder rang."},
{h:"4. Samenwerking smeden", s:"Gereedschap voor kwetsbaarheid op schaal: de braintrust van Pixar (het werk wordt gefileerd, niet de maker), red teams, en leiders die hun eigen feilbaarheid ritueel benoemen. De regel: wees twee keer zo nieuwsgierig als je stelt."},
{h:"5. Een doel vestigen", s:"High-purpose omgevingen bombarderen leden met signalen die heden en ideaal verbinden: verhalen, motto's, artefacten. Niet omdat mensen dom zijn, maar omdat richting continu onderhoud vraagt — een verhaal is de krachtigste vorm."},
{h:"6. Doel in de praktijk", s:"Voor routinewerk (vliegveiligheid, restaurants) werken heldere prioriteiten en herhaalde vuistregels; voor creatief werk (Pixar) werkt het beschermen van het creatieve proces zelf. Benoem je prioriteiten hardop, rangschik ze en meet of iedereen ze kent."}],
"First, Break All the Rules": [
{h:"1. De meetlat", s:"Gallup destilleerde uit een miljoen interviews twaalf vragen (Q12) die een sterke werkplek meten, van 'weet ik wat er van me verwacht wordt' tot 'heb ik een beste vriend op werk'. De cruciale bevinding: scores verschillen meer tussen teams binnen één bedrijf dan tussen bedrijven — de manager is de sleutel."},
{h:"2. De wijsheid van topmanagers", s:"De rode draad uit 80.000 managerinterviews: mensen veranderen niet wezenlijk. Verspil geen energie aan erin stoppen wat er niet in zit; haal eruit wat erin zit. De manager is katalysator tussen talent en prestatie."},
{h:"3. Eerste sleutel: selecteer op talent", s:"Talent is elk terugkerend patroon van denken, voelen of gedrag dat productief inzetbaar is — filters die niet aan te leren zijn, anders dan kennis en vaardigheden. Definieer per rol de dragende talenten en interview daarop met open vragen over feitelijk gedrag."},
{h:"4. Tweede sleutel: definieer de juiste uitkomsten", s:"Stuur op resultaat en laat de route vrij: mensen bereiken hetzelfde doel langs verschillende sterktes. Standaardiseer alleen waar veiligheid of nauwkeurigheid het eist, nooit de stijl."},
{h:"5. Derde sleutel: focus op sterke punten", s:"Besteed de meeste aandacht aan je beste mensen en aan ieders sterktes; manage rond zwaktes heen met hulpmiddelen, partners of herplaatsing. Uitzonderlijke prestaties komen uit uitbouwen van wat al sterk is."},
{h:"6. Vierde sleutel: vind de juiste plek", s:"Promotie de ladder op is niet het enige groeipad: de beste verkoper wordt vaak een matige manager. Creëer heldenstatus en beloningsgroei bínnen rollen, zodat mensen kunnen excelleren waar hun talent zit."},
{h:"7. De kunst van het interviewen en sturen", s:"Praktische technieken: stel open vragen en geloof wat iemand spontaan vertelt, luister naar snelle, specifieke antwoorden als teken van talent, en voer regelmatig prestatiegesprekken over sterktes, doelen en de juiste fit."}],
"It's the Manager": [
{h:"Strategie en cultuur (h.1-9)", s:"Organisatiesucces begint bij een duidelijke purpose en cultuur die de klantbelofte draagt. De grootste kans: van tevredenheids- naar ontwikkelingscultuur. Medewerkers — zeker jongere generaties — kiezen voor groei ('my development') boven perks en pingpongtafels."},
{h:"Het employment brand (h.10-16)", s:"Werving is marketing geworden: sterke werkgevers kennen hun sterktes, werven op talent én fit, en maken onboarding tot de bevestiging van de belofte in plaats van een papierronde. De eerste ervaring voorspelt retentie."},
{h:"Van baas naar coach (h.17-24)", s:"De kernboodschap: 70% van de variantie in teambetrokkenheid hangt aan de manager. De omslag is van beoordelen naar ontwikkelen, met vijf gesprekstypen — van rolverheldering tot snelle check-ins en ontwikkelgesprekken. Eén betekenisvol gesprek per week per medewerker is de krachtigste interventie."},
{h:"Sterke punten als fundament (h.25-33)", s:"Sterkte-gebaseerde ontwikkeling verhoogt betrokkenheid, productiviteit en winst aantoonbaar. Focus op wat iemand van nature goed doet, maak zwaktes beheersbaar, en gebruik een gedeelde sterke-punten-taal in het team."},
{h:"Welzijn en de hele mens (h.34-40)", s:"Gallups vijf welzijnselementen horen op de managementagenda: een medewerker in financiële stress of sociaal isolement presteert niet. De grens tussen werk en leven is vervaagd; managers zijn de eerstelijn."},
{h:"De toekomst van werk (h.41-52)", s:"Slothoofdstukken over gig-werk, AI, analytics en diversiteit: technologie verandert taken, maar de menselijke behoeften (doel, ontwikkeling, gezien worden) blijven de constante. HR wordt de hoeder van zowel data als menselijkheid."}],
"Wellbeing at Work": [
{h:"1. De vijf elementen", s:"Gallup onderscheidt loopbaan-, sociaal, financieel, fysiek en maatschappelijk welzijn. Loopbaanwelzijn — elke dag doen waar je goed in bent en van houdt — is het fundament: wie daar laag scoort, compenseert dat zelden met de andere vier."},
{h:"2. Loopbaanwelzijn", s:"De belangrijkste interventies zijn geen programma's maar werk: sterktes benutten, een manager die coacht, ontwikkeling zien. De ergste welzijnskiller is een baan waarin je genegeerd wordt; zelfs slecht management is minder schadelijk dan onzichtbaarheid."},
{h:"3. Sociaal en financieel welzijn", s:"Vriendschap op werk is een prestatiefactor, geen soft extraatje. Financiële stress sloopt concentratie en gezondheid; werkgevers helpen met zekerheid, eerlijke beloning en praktische begeleiding — niet met eenmalige bonussen."},
{h:"4. Fysiek en maatschappelijk welzijn", s:"Slaap, beweging en voeding beïnvloeden dagelijkse energie; de werkomgeving moet gezond gedrag makkelijk maken. Maatschappelijk welzijn — ergens bij horen, bijdragen aan je gemeenschap — voedt betekenis en binding."},
{h:"5. Net thriving en mentale gezondheid", s:"Gallup meet welzijn als 'thriving, struggling, suffering'. Betrokken maar uitgeput is een risicoprofiel: hoge betrokkenheid zonder welzijn leidt tot burn-out. Managers moeten beide tegelijk volgen, en mentale gezondheid bespreekbaar maken zonder therapeut te spelen."},
{h:"6. Een veerkrachtige cultuur", s:"Welzijn beklijft alleen als het in de cultuur zit: leiders die het voorleven, managers die ernaar vragen, en systemen (roosters, werkdruk, normen) die gezond gedrag mogelijk maken in plaats van bestraffen."}],
"Thinking, Fast and Slow": [
{h:"Deel 1. Twee systemen", s:"Systeem 1 denkt snel, automatisch en associatief; Systeem 2 traag, moeizaam en logisch. Systeem 2 is lui en accepteert meestal wat Systeem 1 aanlevert — inclusief de fouten. WYSIATI: we bouwen coherente verhalen op de aanwezige informatie en missen wat afwezig is."},
{h:"Deel 2. Heuristieken en biases", s:"Bij moeilijke vragen beantwoorden we ongemerkt een makkelijkere: hoe beschikbaar is een voorbeeld (availability), hoe representatief oogt iemand (waardoor base rates sneuvelen), aan welk getal zijn we net blootgesteld (anchoring). Elk ervan speelt in sollicitaties, beoordelingen en risico-inschattingen."},
{h:"Deel 3. Overmoed", s:"We overschatten hoezeer we de wereld begrijpen: hindsight maakt het verleden verklaarbaar en de toekomst voorspelbaar-lijkend. De illusie van validiteit laat experts vertrouwen op oordelen die niets voorspellen; de planningsfout laat elk project langer duren dan gepland. Remedie: de outside view — kijk naar de statistiek van vergelijkbare gevallen."},
{h:"Deel 4. Keuzes", s:"Prospecttheorie: we wegen verliezen ongeveer twee keer zo zwaar als winsten en beoordelen alles ten opzichte van een referentiepunt. Framing stuurt beslissingen: '90% overleeft' voelt anders dan '10% sterft'. Wie beleid maakt, kiest dus altijd een frame — bewust of niet."},
{h:"Deel 5. Twee zelven", s:"Het ervarende zelf leeft de momenten; het herinnerende zelf oordeelt achteraf op piek en einde (peak-end rule) en verwaarloost duur. Voor werk betekent dit: hoe een traject eindigt en piekt bepaalt hoe mensen het onthouden — van sollicitatie tot exit."}],
"Noise": [
{h:"Deel 1. Ruis gevonden", s:"Twee rechters, dezelfde zaak, jaren verschil in straf; twee schade-experts, dezelfde claim, de helft verschil in bedrag. Waar bias de gemiddelde afwijking is, is ruis de spreiding — en die blijkt in vrijwel elke professionele oordeelspraktijk schokkend groot, ook waar organisaties uniformiteit veronderstellen."},
{h:"Deel 2. Je hoofd als meetinstrument", s:"Oordelen is meten met je geest, en dat instrument is instabiel: level noise (de een is structureel strenger), pattern noise (ieders eigen idiosyncratische patronen) en occasion noise (humeur, weer, tijdstip). Een ruisaudit — meerdere beoordelaars, dezelfde casussen, onafhankelijk — maakt het zichtbaar."},
{h:"Deel 3. Voorspellende oordelen", s:"Simpele regels en modellen verslaan menselijke voorspellers verrassend vaak, juist omdat ze ruisvrij zijn. Mensen voegen vooral ruis toe, geen inzicht; zelfs een model van de beoordelaar (zijn eigen regels, consequent toegepast) verslaat de beoordelaar."},
{h:"Deel 4. Hoe ruis ontstaat", s:"Psychologische bronnen: we matchen op intensiteit, vormen te snel coherente indrukken (halo), en schalen zonder ankers laten iedereen iets anders verstaan onder 'een 4'. Groepen versterken ruis via informatiecascades: wie eerst spreekt, stuurt de rest."},
{h:"Deel 5. Beslishygiëne", s:"Zes remedies: streef naar accuratesse in plaats van individuele expressie, denk statistisch (outside view), structureer oordelen in onafhankelijke deeloordelen, weersta voortijdige intuïtie, laat beoordelaars eerst onafhankelijk oordelen en aggregeer dan, en veranker schalen met concrete voorbeelden."},
{h:"Deel 6. De juiste hoeveelheid ruis", s:"Regels elimineren ruis maar kosten maatwerk en gaming ligt op de loer; standaarden geven ruimte maar ruisen. De afweging is expliciet te maken: waar zijn fouten door ruis duurder dan de kosten van strakkere structuur?"}],
"Mindset": [
{h:"1-2. De twee mindsets", s:"Een statische mindset ziet vermogens als vaststaand: elke prestatie is een test van je waarde, moeite is een teken van tekort, falen definieert je. Een groeimindset ziet vermogens als ontwikkelbaar: uitdaging is aantrekkelijk, moeite is de weg, falen is informatie. Iedereen heeft van beide iets, per domein verschillend."},
{h:"3. De waarheid over vermogen en prestatie", s:"Topprestaties komen uit jarenlange gerichte inzet, niet uit puur talent. De statische mindset doet mensen kansen mijden en bij tegenslag opgeven; labels ('hoogbegaafd', 'natuurtalent') kunnen prestaties juist ondermijnen doordat ze de mindset statisch maken."},
{h:"4. Sport", s:"Kampioenen als Jordan en Wilma Rudolph tonen de groeimindset in het karakter: trainen op zwaktes, verlies als leermoment. 'Natuurtalenten' die niet leerden werken, stranden zodra het moeilijk wordt."},
{h:"5. Business en leiderschap", s:"Statische CEO's bouwen hoven van bevestiging en verbergen fouten; groeigerichte leiders (Dweck contrasteert o.a. met Enron-cultuur) stellen vragen, omringen zich met kritiek en ontwikkelen mensen. Organisaties hebben zelf een mindset: 'genius-cultures' versus leer-culturen — met meetbaar effect op vertrouwen en innovatie."},
{h:"6-7. Relaties, ouders en leraren", s:"In relaties betekent groeimindset: conflicten zijn op te lossen, de ander kan veranderen. Voor opvoeders en managers: prijs proces en strategie, niet de persoon ('wat slim van jou' schaadt); geef eerlijke feedback met hoge verwachting én steun."},
{h:"8. Mindsets veranderen", s:"Verandering begint met het horen van je eigen statische stem, erkennen dat je een keuze hebt, en jezelf groeigericht antwoorden — plus concreet: wat ga ik doen, wanneer, hoe? Mindset is een praktijk, geen switch."}],
"Grit": [
{h:"1-3. Talent leidt af", s:"We zeggen inzet te waarderen maar vereren 'natuurtalent'. Duckworth ontleedt de mythe: talent × inzet = vaardigheid, en vaardigheid × inzet = prestatie — inzet telt twee keer. Grit (passie + volharding voor langetermijndoelen) voorspelt wie West Point afmaakt en wie spellingwedstrijden wint."},
{h:"4-5. Hoe grit groeit", s:"Grit is meetbaar (de Grit Scale) en ontwikkelbaar. Passie blijkt geen vuurwerk maar een kompas: een stabiele levensfilosofie waaraan lagere doelen ondergeschikt zijn. Wie op elk niveau doelen ergens anders heen laat wijzen, versnippert."},
{h:"6-7. Interesse en oefening", s:"Interesses worden niet ontdekt door introspectie maar ontwikkeld door proberen, spelen en verdiepen. Daarna komt deliberate practice: gericht oefenen op wat nét niet lukt, met directe feedback en herhaling — dagelijks, ritueel, ongemakkelijk."},
{h:"8-9. Zingeving en hoop", s:"Grit rijpt als interesse verbonden wordt aan het welzijn van anderen: van baan naar roeping (job crafting kan daarbij helpen). Hoop is bij Duckworth geleerde volharding: de overtuiging dat eigen inspanning de uitkomst verandert — het tegendeel van aangeleerde hulpeloosheid."},
{h:"10-12. Grit van buitenaf", s:"Veeleisend én steunend opvoeden ('wise parenting') kweekt grit; buitenschoolse activiteiten die je minstens een jaar volhoudt trainen het. En cultuur draagt het af: wie zich identificeert met een gritty groep ('wij maken dingen af'), wordt het zelf."}],
"Give and Take": [
{h:"1. Goede opbrengsten", s:"Drie omgangsstijlen: takers halen meer dan ze geven, matchers houden de balans bij, givers geven zonder directe tegenprestatie. Verrassing uit de data: givers zitten onderin én bovenin elke prestatieladder — het boek gaat over wat de top-givers anders doen."},
{h:"2. Netwerken", s:"Takers bouwen brede maar dunne netwerken die uiteindelijk tegen hen keren (mensen praten). Givers bouwen slapende banden ('dormant ties') vol goodwill die jaren later waarde opleveren. De vijf-minuten-gunst van Adam Rifkin is het model: kleine hulp, grote waarde, geen boekhouding."},
{h:"3. Samenwerken", s:"Givers claimen minder credit en delen meer, waardoor teams beter worden en zij psychologisch veilig gedrag uitlokken. Het 'responsibility bias' (iedereen overschat het eigen aandeel) verdwijnt bij wie eerst benoemt wat anderen bijdroegen."},
{h:"4. Talent zien", s:"Givers zien potentieel in mensen die anderen afschrijven, omdat ze investeren zonder eerst bewijs te eisen. Takers ontwikkelen alleen wie hen dient; matchers alleen wie al bewezen heeft. Gouden regel: motivatie en inzet zijn betere voorspellers dan eerste indrukken van 'talent'."},
{h:"5. Machteloze communicatie", s:"Vragen stellen, twijfel tonen, advies vragen — schijnbaar zwakke communicatie blijkt krachtig: het wekt vertrouwen en maakt anderen mede-eigenaar. Advies vragen is de meest onderschatte beïnvloedingstechniek."},
{h:"6. Burn-out voorkomen", s:"Givers branden niet op door te veel geven maar door geven zonder zichtbaar effect. Remedies: chunk je geven (vaste momenten in plaats van altijd), zoek de impact van je hulp op, en geef waar het je eigen energie past ('otherish' geven)."},
{h:"7-8. Geen doetje worden", s:"Tegen takers: word een 'disagreeable giver' — genereus in doel, kritisch in stijl — en schakel naar matcher-gedrag bij wie misbruik maakt (generous tit for tat). Slot: gevende culturen ontstaan waar hulp vragen normaal is; organiseer dat expliciet, bijvoorbeeld met reciprocity rings."}],
"Think Again": [
{h:"1. Prediker, aanklager, politicus... of wetenschapper", s:"In discussies schieten we in drie rollen: prediken (onze waarheid verkondigen), aanklagen (de ander onderuithalen) of politiek bedrijven (het publiek behagen). Het alternatief is denken als wetenschapper: opvattingen als hypotheses, meningsverandering als vooruitgang."},
{h:"2-3. Zelfvertrouwen en twijfel", s:"Het armchair-quarterback-syndroom (overtuiging zonder kunde) en het impostorsyndroom (kunde zonder overtuiging) zijn beide uit balans. Het optimum is confident humility: geloof in je leervermogen, twijfel aan je huidige kennis. De vreugde van ongelijk hebben: elke ontdekte fout is er één minder."},
{h:"4. De goede vechtclub", s:"Relatieconflict schaadt teams, taakconflict verbetert ze — mits gescheiden van de persoon. Goede tegendenkers zoek je op: netwerken van uitdagers in plaats van bevestigers, en debatteren over 'hoe weten we dit?' in plaats van 'wie heeft gelijk?'"},
{h:"5-7. Anderen aan het herdenken krijgen", s:"Debatten win je door te luisteren: sterke argumenten in plaats van veel argumenten, gemeenschappelijke grond zoeken, en vragen stellen die de ander zelf laten twijfelen (motiverende gespreksvoering). Daryl Davis, die KKK-leden hun gewaden liet inleveren, is het extreme bewijs: nieuwsgierigheid verslaat confrontatie."},
{h:"8-9. Gepolariseerde gesprekken en leren", s:"Complexiteit tonen ontwapent polarisatie: laat de grijstinten en de onzekerheid zien in plaats van twee kampen. In onderwijs: leer kinderen kennis herzien, laat ze concepten meermaals herschrijven zoals wetenschappers doen."},
{h:"10-11. Leerculturen op werk en levensplannen", s:"Organisaties hebben psychologische veiligheid én verantwoordingsplicht over het proces nodig: beloon niet alleen uitkomsten maar de kwaliteit van beslissingen. Slot: pas identiteitsvorming op — plan je leven als hypothese, niet als tunnel; herzie je carrière zoals je een overtuiging herziet."}],
"Hidden Potential": [
{h:"1. Karaktervaardigheden", s:"Groei zegt meer dan startpunt: potentieel is afgelegde afstand. Karaktervaardigheden — proactief zijn, discipline, doorzetten in ongemak — zijn leerbaar en voorspellen die afstand beter dan aanleg. Grant opent met de Raging Rooks, schakers uit Harlem die kampioenen werden."},
{h:"2. Het ongemak opzoeken", s:"Leren versnelt als je de methode kiest die het ongemakkelijkst voelt: spreken voordat je 'klaar' bent, doen in plaats van kijken. Polyglotten leren talen door vroeg fouten te maken; de comfortabele route is meestal de trage."},
{h:"3. Spons zijn en imperfectionisme", s:"Goede leerders filteren: ze zoeken actief informatie en oordelen wélke feedback telt (spons, geen deurmat). Perfectionisme remt: excellente presteerders bepalen bewust waar 'goed genoeg' volstaat, zodat de energie naar de paar dingen gaat die perfect moeten."},
{h:"4-5. Deliberate play en de motivatiestructuur", s:"Oefenen hoeft niet te schuren om te werken: deliberate play — oefening in spelvorm met feedback — houdt vol wat pure discipline niet volhoudt. Bij vastlopen: neem een omweg (nieuwe context, tijdelijk iets anders), want vooruitgang is zelden lineair."},
{h:"6. Jezelf omhoog bootstrappen", s:"Zonder gunstige omstandigheden kun je je eigen steigers bouwen: jezelf onderwijzen door anderen les te geven (het tutor-effect), je eigen coach worden en hulp durven vragen. Grant illustreert dit met de Golden Thirteen, de eerste zwarte marineofficieren in de VS."},
{h:"7-8. Systemen: scholen en teams", s:"Finse scholen halen potentieel breed naar boven met maatwerk en gelijke kansen; slimme teams ontstaan niet uit slimme individuen maar uit processen die iedereen laten bijdragen (gebalanceerde beurtwisseling, prosociale normen). Leiderschap: laat de beste ideeën winnen, niet de hardste stemmen."},
{h:"9. Diamanten in de ruwe selecteren", s:"Selectiesystemen missen laatbloeiers: kijk naar trajectoriën in context (wat overwon iemand?), geef herkansingen en toets vaardigheden in het echte werk. Wie alleen gepolijste cv's selecteert, werft privilege in plaats van potentieel."}],
"Quiet": [
{h:"Deel 1. Het extraverte ideaal", s:"Amerika (en het bedrijfsleven wereldwijd) verruilde in de 20e eeuw een cultuur van karakter voor een cultuur van persoonlijkheid: verkopen, uitstralen, opvallen. Harvard Business School en het open kantoor zijn eraan gebouwd — terwijl onderzoek laat zien dat spreekvaardigheid en ideeënkwaliteit niets met elkaar te maken hebben, en groepsbrainstorms minder opleveren dan alleen denken."},
{h:"Deel 2. Biologie en temperament", s:"Introversie heeft een biologische kern: hoog-reactieve zenuwstelsels reageren sterker op prikkels (Kagans onderzoek). Maar temperament is geen lot: mensen rekken zich op voor wat ze belangrijk vinden. De 'orchidee-hypothese': gevoelige mensen floreren juist uitzonderlijk in de goede omgeving."},
{h:"Deel 3. Cultuurverschillen", s:"Wat 'zelfverzekerd optreden' heet, is cultureel: in veel Aziatische tradities is luisteren en bescheidenheid juist kracht. Organisaties die één communicatiestijl belonen, missen systematisch talent uit andere tradities."},
{h:"Deel 4. Liefde en werken", s:"Praktisch: introverten kunnen extravert acteren voor 'core personal projects' (Little's free trait theory), mits met hersteltijd ('restorative niches'). Voor koppels en collega's: begrijp elkaars prikkelbehoefte. Voor kantoren: bied stilteplekken, stuur agenda's vooraf, en beoordeel bijdrage op inhoud in plaats van zendtijd."}],
"Flow": [
{h:"1-2. Geluk en de anatomie van bewustzijn", s:"Geluk komt niet van omstandigheden maar van controle over je aandacht. Psychische entropie — zorgen, afleiding, wanorde in het hoofd — is de natuurlijke toestand; flow is het tegendeel: aandacht volledig geordend rond één doel."},
{h:"3. De voorwaarden van optimale ervaring", s:"Flow-activiteiten delen kenmerken: heldere doelen, directe feedback, balans tussen uitdaging en vaardigheid, versmelting van handeling en bewustzijn, verdwijnend zelfbewustzijn en vervormde tijdsbeleving. De activiteit wordt autotelisch: het doel is de activiteit zelf."},
{h:"4-5. Lichaam en denken in flow", s:"Van sport en dans tot lezen en wiskunde: elk domein kan flow leveren als je er vaardigheden en structuur in aanbrengt. Passieve consumptie (tv) levert zelden flow; actieve, gestructureerde bezigheid vrijwel altijd."},
{h:"6. Werk als flow", s:"De werkparadox: mensen rapporteren méér flow op werk dan thuis, maar zeggen liever vrij te willen zijn. Werk heeft van nature doelen, feedback en uitdaging — de opdracht is banen zo te ontwerpen dat ze op flow-activiteiten lijken, en mensen te leren hun werk zo te benaderen."},
{h:"7-8. Relaties en tegenslag", s:"Ook gezelschap en zelfs eenzaamheid vragen ordening van aandacht: relaties floreren met gezamenlijke doelen en aandacht. Mensen die rampen doorstaan zonder te breken ('cheating chaos') herstructureren tegenslag tot nieuwe doelen — transformationele coping."},
{h:"9-10. Betekenis", s:"Het slot: losse flow-momenten worden pas een goed leven als ze samenhangen in één levensthema — een overkoepelend doel dat al je activiteiten richting geeft. Zin maak je, je vindt haar niet."}],
"Atomic Habits": [
{h:"1-3. Fundamenten", s:"Kleine verbeteringen stapelen exponentieel: 1% per dag is 37x per jaar. Vergeet doelen, bouw systemen — winnaars en verliezers hebben dezelfde doelen. Duurzame verandering is identiteitsverandering: elke handeling is een stem voor het type persoon dat je wilt zijn. Gewoontes lopen in vier stappen: cue, verlangen, respons, beloning."},
{h:"Wet 1. Maak het zichtbaar", s:"Gedrag start bij cues: word je bewust van bestaande gewoontes (habits scorecard), gebruik implementatie-intenties ('ik doe X om [tijd] in [plek]') en habit stacking ('na [bestaande gewoonte] doe ik [nieuwe]'). Ontwerp je omgeving: maak cues van goed gedrag zichtbaar en van slecht gedrag onzichtbaar."},
{h:"Wet 2. Maak het aantrekkelijk", s:"Verlangen drijft actie: koppel wat je moet doen aan wat je wilt doen (temptation bundling) en sluit je aan bij groepen waar het gewenste gedrag normaal is — we imiteren de nabije groep, de massa en de machtigen."},
{h:"Wet 3. Maak het makkelijk", s:"Herhaling verslaat perfectie: gewoontes vormen zich door frequentie, niet door tijd. Verklein frictie voor goed gedrag, vergroot die voor slecht gedrag, en gebruik de twee-minutenregel: elke nieuwe gewoonte begint als versie van twee minuten."},
{h:"Wet 4. Maak het bevredigend", s:"Wat direct beloond wordt, herhaal je: voeg kleine onmiddellijke beloningen toe, maak voortgang zichtbaar (habit tracking, 'don't break the chain') en mis nooit twee keer. Een accountability-partner of contract maakt verzaken direct kostbaar."},
{h:"Gevorderd", s:"Kies gewoontes waar aanleg en nieuwsgierigheid samenkomen (explore/exploit), blijf op de Goldilocks-rand van net-haalbare uitdaging, en waak voor het plateau van meesterschap: reflecteer en herzie periodiek, want gewoontes maken ook blind."}],
"Nudge": [
{h:"1. Biases en blunders", s:"Mensen zijn geen econs maar humans: we ankeren, volgen defaults, overschatten beschikbare voorbeelden en zijn verliesavers. Keuzearchitectuur is onvermijdelijk — er is geen neutrale presentatie van opties, dus wie ontwerpt, stuurt."},
{h:"2-3. Verleiding en de kudde", s:"Zelfcontrole faalt voorspelbaar (Planner versus Doer in ons), en we doen massaal wat anderen doen — of wat we dénken dat anderen doen. Sociale normen communiceren is daarmee een krachtig én riskant instrument: benoem nooit ongewenst gedrag als wijdverbreid."},
{h:"4. Wanneer nudgen?", s:"Nudges helpen het meest waar beslissingen moeilijk en zeldzaam zijn, feedback traag is en de link tussen keuze en gevolg onduidelijk (pensioen, gezondheid, verzekeringen). Libertair paternalisme: stuur de keuze, behoud de vrijheid."},
{h:"5. Geld", s:"Save More Tomorrow is de beroemdste nudge: mensen committeren zich nú aan sparen van toekomstige loonsverhogingen — verliesaversie en uitstelgedrag worden bondgenoten. Automatische inschrijving in pensioenregelingen verveelvoudigt deelname."},
{h:"6. Gezondheid en orgaandonatie", s:"Defaults bepalen levens: opt-out versus opt-in bij orgaandonatie scheelt tientallen procentpunten. Vereenvoudiging (minder stappen, heldere brieven) is de meest onderschatte interventie in elk formulierproces."},
{h:"7. Kritiek en spelregels", s:"Tegen de sluikreclame-kritiek: nudges moeten transparant zijn en makkelijk te omzeilen (publiciteitstoets: kun je de nudge publiek verdedigen?). 'Sludge' — frictie die mensen van hun eigen belang afhoudt — is de kwade tweeling en hoort opgeruimd."}],
"Influence": [
{h:"1. Wapens van beïnvloeding", s:"Mensen varen op mentale sluiproutes: vaste gedragspatronen die automatisch afgaan op één signaal ('duur = goed'). Handig in een complexe wereld, exploiteerbaar door wie de knoppen kent. Cialdini's ethiek: gebruik de principes waar ze waarheidsgetrouw zijn, nooit als vervalsing."},
{h:"2. Wederkerigheid", s:"Wie iets krijgt, voelt een dwingende plicht terug te geven — ook bij ongevraagde gunsten, en zelfs een concessie geldt als gunst (rejection-then-retreat). Op werk: geef eerst oprecht (hulp, informatie, vertrouwen) en wederkerigheid doet de rest."},
{h:"3. Commitment en consistentie", s:"Na een keuze willen we consistent blijven, vooral na publieke, actieve, vrijwillige commitments. Kleine eerste stappen ('foot in the door') veranderen zelfbeeld en daarmee groot gedrag. Laat mensen plannen zelf uitspreken en opschrijven."},
{h:"4. Sociaal bewijs", s:"Bij onzekerheid kijken we wat vergelijkbare anderen doen. Kracht: echte voorbeelden van gelijken die al meedoen. Gevaar: 'iedereen doet het verkeerd' communiceren normaliseert precies het verkeerde."},
{h:"5. Sympathie", s:"We zeggen ja tegen wie we mogen: gelijkenis, complimenten, samenwerking aan gedeelde doelen, vertrouwdheid. In teams: bouw eerst de relatie en de gedeelde identiteit, dan pas het verzoek."},
{h:"6. Autoriteit", s:"Symbolen van expertise (titels, kleding, context) doen ons volgen zonder toetsing — met Milgram als donker bewijs. Wees geloofwaardige autoriteit: toon expertise én eerlijkheid, bijvoorbeeld door eerst een nadeel te noemen."},
{h:"7. Schaarste", s:"Wat schaars(er) wordt, willen we meer — vooral bij nieuw ontstane schaarste en concurrentie. Eerlijk gebruik: benoem reële deadlines en unieke kansen. En herken het bij jezelf: opwinding over 'bijna weg' is een signaal om juist te vertragen."},
{h:"8. Eenheid", s:"Het nieuwste principe: 'wij' verslaat alles — gedeelde identiteit (familie, plaats, samen creëren) maakt beïnvloeding het diepst. Co-creatie (mensen om advies vragen) maakt van publiek mede-eigenaar."}],
"Switch": [
{h:"1. Drie verrassingen over verandering", s:"Het beeld: een ruiter (rationeel) op een olifant (emotie) langs een pad (omgeving). Wat een menskwestie lijkt, is vaak een situatiekwestie; wat luiheid lijkt, is uitputting; wat weerstand lijkt, is onduidelijkheid."},
{h:"2. Volg de lichtpuntjes", s:"Zoek waar het al wél lukt en repliceer dat. Sternins Vietnamese dorpen (goed gevoede kinderen bij dezelfde armoede) bewijzen: de oplossing zit al in het systeem — analyseer successen in plaats van problemen."},
{h:"3. Script de kritieke stappen", s:"Verandering strandt op keuzestress: vertaal de visie in enkele concrete gedragingen ('koop halfvolle melk' in plaats van 'eet gezonder'). Ambiguïteit is de vijand; specificiteit de vriend."},
{h:"4. Wijs naar de bestemming", s:"Een bestemmingsansichtkaart — een levendig beeld van de nabije toekomst — geeft de ruiter richting en de olifant zin. 'Binnen een jaar zijn wij...' werkt beter dan abstracte doelstellingen."},
{h:"5. Vind het gevoel", s:"Weten is niet genoeg; verandering vraagt voelen. SEE-FEEL-CHANGE verslaat ANALYZE-THINK-CHANGE: laat het probleem zien en ervaren (de handschoenenberg op de bestuurstafel) in plaats van het te presenteren."},
{h:"6-7. Verklein de verandering, laat mensen groeien", s:"Maak de eerste stap belachelijk klein (5-minuten-kamer-redding) en geef mensen een voorsprongsgevoel. Voed daarnaast identiteit: 'mensen zoals wij doen dit' plus een groeimindset over de leercurve."},
{h:"8-9. Pas de omgeving aan en bouw gewoontes", s:"Verander de situatie en het gedrag volgt: één-klik-minder, andere formulieren, herinrichting. Bouw actietriggers en checklists zodat goed gedrag geen wilskracht meer vraagt."},
{h:"10-11. Verzamel de kudde en houd vol", s:"Gedrag is besmettelijk: maak gewenst gedrag zichtbaar en publiek. Versterk elke kleine stap in de goede richting — verandering is een sneeuwbal, geen schakelaar."}],
"The Progress Principle": [
{h:"1-2. Het innerlijke werkleven", s:"Onder elke werkdag ligt een stroom emoties, percepties en motivaties die prestaties stuurt — grotendeels onzichtbaar voor managers. Uit 12.000 dagboekfragmenten blijkt: mensen presteren beter op dagen met een positief innerlijk werkleven, en dat wordt gevoed door gebeurtenissen, niet door persoonlijkheid."},
{h:"3-4. Het voortgangsprincipe", s:"De beste werkdagen delen één kenmerk: zichtbare voortgang in betekenisvol werk, hoe klein ook. De slechtste dagen: tegenslagen en teruggedraaid werk. Managers gokken op erkenning en prikkels als motivator nummer één; voortgang eindigt in hun inschatting onderaan — de grootste managementblinde vlek uit het boek."},
{h:"5. Kleine mijlpalen, grote effecten", s:"Tegenslagen wegen zwaarder dan successen (negativiteitsdominantie), dus voorkom vooral obstakels en gezichtsverlies. Knip werk op in haalbare mijlpalen zodat voortgang frequent en zichtbaar is; betekenis vervliegt als werk genegeerd, afgepakt of weggegooid wordt."},
{h:"6. Katalysatoren", s:"Zeven werkfactoren versterken voortgang direct: heldere doelen, autonomie, voldoende middelen en tijd, hulp, leren van problemen én successen, en vrije ideeënstroom. Hun afwezigheid ('inhibitors') doet het omgekeerde — en managers veroorzaken die vaak onbedoeld."},
{h:"7. Voeding", s:"Naast het werk zelf voeden interpersoonlijke factoren het innerlijke werkleven: respect, aanmoediging, emotionele steun en verbondenheid. 'Toxins' — kleinerende opmerkingen, genegeerd worden — beschadigen onevenredig."},
{h:"8. De dagelijkse checklist", s:"Het instrument: sluit elke dag kort af met de vraag welke voortgang en tegenslag er was, welke katalysatoren en gifstoffen speelden, en wat morgen één obstakel minder maakt. Klein ritueel, structureel effect."}],
"Primed to Perform": [
{h:"1-2. Total motivation", s:"Waarom je werkt bepaalt hoe goed je werkt. Zes motieven op een glijdende schaal: spel (het werk zelf is leuk), zingeving (de uitkomst telt), potentieel (het brengt me ergens) versus emotionele druk (schuld, schaamte), economische druk (beloning/straf) en inertie ('ik deed het gister ook'). De eerste drie verhogen prestaties, de laatste drie verlagen ze."},
{h:"3-4. Adaptieve prestaties", s:"Organisaties hebben twee soorten prestaties nodig: tactisch (het plan uitvoeren) en adaptief (afwijken van het plan als de wereld verandert). Druk verbetert hooguit tactiek maar sloopt aanpassingsvermogen — de verklaring waarom angstculturen precies falen wanneer het spannend wordt (cobra-effect, tunnelvisie, sjoemelen)."},
{h:"5-6. ToMo meten", s:"De total-motivation-score (ToMo) is meetbaar per team en voorspelt klanttevredenheid en omzet: de auteurs tonen verschillen tussen winkels en airlines die vrijwel volledig door cultuur verklaard worden. Meet motieven, niet alleen tevredenheid."},
{h:"7-12. De cultuurbouwstenen", s:"ToMo wordt gedreven door ontwerpkeuzes: rolontwerp (ruimte voor spel en zichtbare impact is de krachtigste knop), identiteit (missie en gedragscode), carrièreladders en beloning (voorspelbaar en eerlijk, druk eruit), gemeenschap en leiderschap (leiders die vragen stellen en experimenteerruimte geven)."},
{h:"13-14. De vuurtoren bouwen", s:"Cultuur wordt pas beheersbaar als je haar behandelt als proces: meet ToMo periodiek, geef teams eigenaarschap over verbeteringen en bouw een 'chief culture'-verantwoordelijkheid. Prestatiebeoordeling verschuift van afrekenen naar het versterken van spel, zin en potentieel."}],
"The Burnout Challenge": [
{h:"1-2. Burn-out als relatieprobleem", s:"Burn-out is geen individuele zwakte maar een verstoorde relatie tussen persoon en werk, zoals een plant in de verkeerde grond. Drie dimensies: uitputting, cynisme en een ondermijnd gevoel van effectiviteit. De pandemie legde bloot wat er al was: chronische werkstressoren zonder herstel."},
{h:"3. Vijf profielen", s:"Tussen bevlogen en opgebrand liggen tussenvormen: overextended (alleen uitgeput), ineffective (alleen twijfel aan eigen kunnen), disengaged (alleen cynisch). Elk profiel vraagt een andere interventie — één generieke vitaliteitsaanpak mist ze allemaal."},
