{h:"4-9. De zes mismatches", s:"Per gebied een hoofdstuk: werkdruk (chronisch te veel, te weinig herstel), regie (geen zeggenschap over hoe), beloning (materieel én erkenning), gemeenschap (isolatie, conflict), rechtvaardigheid (favoritisme, oneerlijke processen) en waarden (werk dat schuurt met je overtuigingen). Kleine chronische ergernissen — 'steentjes in de schoen' — voorspellen burn-out beter dan grote incidenten."},
{h:"10-11. Wie moet er veranderen?", s:"Fix de baan, niet alleen de persoon: weerbaarheidstraining tegen een oneerlijk rooster is symptoombestrijding. Werkgevers moeten mismatches opsporen en herontwerpen; individuen kunnen wel hun eigen mismatch-profiel kennen en gericht agenderen."},
{h:"12. Betere matches maken", s:"De weg vooruit: periodieke mismatch-gesprekken per team, kleine experimenten per gebied (werkdrukventielen, meer regelruimte, eerlijke verdeling), en het serieus nemen van vroege signalen. Goede matches zijn geen luxe: ze zijn hoe werk gezond blijft."}],
"Dying for a Paycheck": [
{h:"1-2. De onzichtbare rekening", s:"Schadelijk management is een volksgezondheidsprobleem: Pfeffer schat dat werkomstandigheden in de VS jaarlijks aan tienduizenden sterfgevallen en vele miljarden aan zorgkosten bijdragen. Omdat de kosten bij medewerkers en de maatschappij landen, voelt de veroorzaker ze niet — een klassieke externaliteit."},
{h:"3. Ontslag en baanonzekerheid", s:"Reorganisaties en flexibilisering beschadigen gezondheid aantoonbaar — ook van de blijvers — en leveren zelden de beloofde productiviteit. Baanonzekerheid werkt als chronische stressor met effecten vergelijkbaar met roken."},
{h:"4. Lange uren en werk-privéconflict", s:"Structureel overwerk verhoogt hart- en vaatrisico's en vermindert de productiviteit per uur; werk-privéconflict raakt gezondheid én gezin. Aanwezigheidscultuur beloont zichtbaarheid, niet waarde."},
{h:"5-6. Regie en steun", s:"De giftigste combinatie: hoge eisen met lage regelruimte (het demand-control-model) — hetzelfde werk mét autonomie is aanzienlijk gezonder. Sociale steun op werk buffert stress; eenzaam werk versterkt hem."},
{h:"7-8. Waarom mensen blijven en wat te doen", s:"Mensen blijven in giftige banen door geld, identiteit en de fuik van geleidelijke verslechtering. Pfeffers agenda: meet gezondheidseffecten van beleid zoals je milieueffecten meet, beloon leiders op menselijke duurzaamheid, en kies als professional bewust voor werkgevers die mensen heel laten."}],
"The Best Place to Work": [
{h:"1. Het succes van falen", s:"Uitzonderlijke prestaties vragen oefenen op de rand van kunnen — en dus fouten. Organisaties die falen bestraffen, krijgen mensen die op veilig spelen en klein oefenen. Ontwerp voor slim falen: experimenten, nabesprekingen zonder schuld, en de onderscheiding tussen vermijdbare en intelligente fouten."},
{h:"2-3. Spel en werkplekontwerp", s:"Spel en pauze zijn cognitieve gereedschappen: afstand nemen voedt creativiteit, en de fysieke omgeving stuurt denken (caves voor focus, campfires voor uitwisseling). Lawaai, onderbrekingen en vergadermarathons zijn ontwerpfouten, geen natuurwetten."},
{h:"4. Energie boven tijd", s:"Prestaties volgen ultradiaanse ritmes: 90 minuten focus, dan herstel. Slaap, beweging en daglicht zijn productiviteitsinstrumenten. Plan zwaar denkwerk op piekenergie en normaliseer pauzes — uitgeputte teams nemen slechtere beslissingen."},
{h:"5-6. Motivatie: de drie behoeften", s:"Zelfdeterminatietheorie als rode draad: autonomie, competentie en verbondenheid voorspellen betrokkenheid beter dan beloning. Geld motiveert tot een drempel; daarboven werken zeggenschap, groei en betekenisvolle relaties. Toets elk beleid aan de drie behoeften."},
{h:"7-8. Leiders en werving", s:"Goede leiders gedragen zich als gastheren: ze ontwerpen de condities waarin anderen schitteren, geven echte redenen bij verzoeken en tonen feilbaarheid. Bij werving: voorspel prestaties met werkproeven en gestructureerde methodes, en verkoop de baan eerlijk — een realistische preview voorkomt dure teleurstelling."}],
"Team of Teams": [
{h:"Deel 1. Het Proteus-probleem", s:"In Irak versloeg een los netwerk (AQI) de best geoliede militaire machine ter wereld. Oorzaak: complexiteit. Gecompliceerde systemen zijn voorspelbaar en optimaliseerbaar (Taylorisme); complexe systemen niet — daar wint aanpassingsvermogen van efficiëntie. McChrystals machine was perfect voor een oorlog die niet meer bestond."},
{h:"Deel 2. Van velen één", s:"Kleine teams (SEALs, chirurgieteams) zijn adaptief door onderling vertrouwen en gedeeld doel — maar die magie schaalt niet vanzelf: tussen teams ontstaan silo's en concurrentie. De oplossing is geen groter team maar een 'team van teams': verbind teams zoals teamleden verbonden zijn."},
{h:"Deel 3a. Gedeeld bewustzijn", s:"Radicale informatiedeling: de dagelijkse O&I-briefing met duizenden deelnemers, fysieke ruimtes zonder muren, need-to-know omgedraaid naar duty-to-share. Iedereen moet het hele systeem snappen om lokaal goed te beslissen — 'systemic understanding' verslaat MECE-hokjes."},
{h:"Deel 3b. Liaisons en vertrouwen kopen", s:"Stuur je beste mensen (niet je misbaren) als liaison naar teams waarmee frictie bestaat, en geef partners meer informatie dan comfortabel voelt. Vertrouwen tussen silo's moet actief gekocht worden met openheid en personele investering."},
{h:"Deel 4. Empowered execution en de tuinman", s:"Als iedereen context heeft, kan beslissingsbevoegdheid radicaal omlaag: 'eyes on, hands off'. Besluiten werden sneller én beter. De leider wordt tuinman: hij kweekt het klimaat — ritme, transparantie, voorbeeldgedrag — in plaats van zetten te bepalen als schaakmeester."}],
"Range": [
{h:"1. De cult van de voorsprong", s:"Tiger Woods (vroeg specialiseren) versus Roger Federer (laat kiezen na breed samplen): het Federer-pad blijkt de regel onder toppers, niet de uitzondering. De vroege-voorsprong-industrie verwart een snelle start met een hoge top."},
{h:"2-3. Kind en wicked omgevingen", s:"In 'kind' omgevingen (schaken, golf) geldt: veel herhaling, snelle eerlijke feedback — daar werkt vroege specialisatie. De meeste kenniswerk-omgevingen zijn 'wicked': patronen herhalen niet en feedback misleidt. Daar winnen brede ervaring en abstract denken; muzikanten die improviseren en meerdere instrumenten proberen, illustreren het."},
{h:"4-5. Leren: langzaam is duurzaam", s:"Wat snel leren lijkt (voordoen, hints, blokken) beklijft slecht; wenselijke moeilijkheden (spacing, testen, interleaving) voelen traag maar bouwen duurzame kennis. En Keplers doorbraak toont het gereedschap van de generalist: analogieën uit verre domeinen."},
{h:"6-7. Match quality en mogelijke zelven", s:"Grit heeft een keerzijde: doorzetten in de verkeerde match. Van Gogh en tal van carrièreswitchers laten zien dat stoppen en wisselen vaak de rationele zet is. Je leert wie je bent door te doen, niet door te introspecteren: test mogelijke zelven in kleine experimenten."},
{h:"8-9. Buitenstaanders en laterale kennis", s:"InnoCentive-vraagstukken worden opgelost door mensen van buiten het vakgebied; Nintendo's Gunpei Yokoi bouwde wereldsuccessen met 'verouderde technologie in nieuw verband'. Specialisten graven diep, integrators verbinden breed — organisaties hebben beiden nodig maar ondervertegenwoordigen de tweede."},
{h:"10-12. Expertise die faalt en amateurs die slagen", s:"Tetlocks egelvoorspellers (één grote theorie) verliezen van vossen (veel kleine inzichten, bijstellen). Teams moeten 'vertrouwde tools durven laten vallen' als de situatie erom vraagt — de brandweermannen van Mann Gulch stierven mét hun gereedschap. Slot: blijf een 'deliberate amateur', experimenteer breed en efficiënt is niet hetzelfde als effectief."}],
"Rebel Ideas": [
{h:"1. Collectieve blindheid", s:"De CIA miste 9/11 niet door domheid maar door homogeniteit: briljante, gelijkgestemde analisten met dezelfde blinde vlekken. Individuele intelligentie optellen is niet genoeg; collectieve intelligentie vraagt verschillende referentiekaders die elkaars gaten dekken."},
{h:"2. Rebels versus klonen", s:"Cognitieve diversiteit — verschil in perspectief en heuristiek — voorspelt teamprestaties bij complexe problemen beter dan gemiddelde slimheid. Maar diversiteit werkt alleen bij relevantie voor het vraagstuk én bij een cultuur die verschil benut in plaats van gladstrijkt."},
{h:"3. Constructief afwijken", s:"Dominantiehiërarchieën (angst voor de baas) smoren informatie — vliegrampen door zwijgende co-piloten zijn het bewijs, crew resource management de remedie. Prestigehiërarchieën (respect op kunde) laten informatie stromen. Leiders: spreek als laatste, beloon tegenspraak."},
{h:"4. Innovatie als recombinatie", s:"Doorbraken ontstaan op kruispunten: ideeën uit het ene domein toegepast in het andere (de rolkoffer, de wetenschappelijke revoluties in steden en netwerken). Wie zijn netwerk homogeen houdt, verliest recombinatiekansen."},
{h:"5. Echokamers", s:"Informatiebubbels ontstaan niet door gebrek aan informatie maar door wantrouwen tegen bronnen van buiten de eigen groep. Ook organisaties bouwen echokamers: interne vergaderingen met alleen believers. Doorbreek ze met structurele buitenblikken."},
{h:"6. Voorbij het gemiddelde", s:"Standaardisatie op 'de gemiddelde gebruiker' faalt — zoals cockpits ontworpen op de gemiddelde piloot niemand pasten. Ontwerp voor spreiding: flexibele systemen, maatwerk, en data uitgesplitst naar subgroepen."}],
"The Culture Map": [
{h:"1. Communiceren: laag- versus hoogcontext", s:"Laagcontextculturen (VS, Nederland) zeggen precies wat ze bedoelen; hoogcontextculturen (Japan, Frankrijk) verwachten dat je tussen de regels leest. Multiculturele teams hebben laagcontext-afspraken nodig: expliciet samenvatten en vastleggen — juist omdat niemand elkaars 'lucht' kan lezen."},
{h:"2. Evalueren: directe versus indirecte kritiek", s:"Los van communicatiestijl verschilt hoe negatieve feedback klinkt: Nederlanders en Russen zijn direct met 'upgraders' (absoluut, totaal), Britten en Japanners verpakken met 'downgraders' (misschien, een beetje). Nederlandse directheid komt elders als bot en zelfs kwetsend binnen."},
{h:"3. Overtuigen: principes eerst of toepassing eerst", s:"Fransen en Duitsers willen eerst het waarom en de theorie; Amerikanen en Nederlanders willen de conclusie en het praktische nut. Bouw presentaties voor gemengd publiek dus tweeledig: kader én concrete toepassing."},
{h:"4. Leiden: egalitair versus hiërarchisch", s:"In egalitaire culturen (Scandinavië, Nederland) mailt iedereen de baas rechtstreeks; in hiërarchische (Japan, India) is dat een affront en spreekt men via de lijn. Wie egalitair leidinggeeft aan een hiërarchisch team, oogst geen initiatief maar verwarring."},
{h:"5. Beslissen: consensus versus top-down", s:"Verrassend los van hiërarchie: Japan is hiërarchisch én consensueel (ringi), de VS egalitair én top-down. Consensusbesluiten duren lang maar zijn daarna onwrikbaar; top-down besluiten vallen snel maar blijven onderweg wijzigen. Spreek af welk type 'besloten' je hanteert."},
{h:"6. Vertrouwen: taak versus relatie", s:"Taakvertrouwen groeit uit betrouwbaar werk (VS, Nederland); relatievertrouwen uit samen gegeten, gelachen en tijd doorgebracht hebben (China, Brazilië). In relatieculturen ís de lunch het werk — sla hem niet over."},
{h:"7. Onenigheid: confronterend versus vermijdend", s:"In Frankrijk en Nederland scherpt openlijk debat het denken; in veel Aziatische culturen beschadigt publieke confrontatie de relatie onherstelbaar. Organiseer daar tegenspraak anoniem of één-op-één vooraf."},
{h:"8. Tijd: lineair versus flexibel", s:"Zwitserse agenda's versus Indiase vloeibaarheid: beide zijn rationeel binnen hun context. Multiculturele teams hebben expliciete teamnormen nodig over deadlines, vergaderstart en wat 'op tijd' betekent."}],
"Radical Candor": [
{h:"1. Het raamwerk", s:"Twee assen: persoonlijk betrokken zijn (care personally) en direct uitdagen (challenge directly). Samen vormen ze radical candor; wie alleen uitdaagt is onaangenaam agressief, wie alleen geeft om de relatie vervalt in ruïneuze empathie — de meest gemaakte fout — en wie geen van beide doet in manipulatieve onoprechtheid."},
{h:"2. Feedback krijgen, geven, aanmoedigen", s:"Volgorde is alles: vraag éérst zelf om kritiek (en verdraag de stilte), geef dan meer lof dan kritiek — beide specifiek en oprecht — en moedig feedback tussen teamleden onderling aan. Kritiek geef je privé en direct; lof publiekelijk."},
{h:"3. Rockstars en superstars", s:"Niet iedereen wil omhoog: rockstars zijn briljant én gelukkig in hun huidige rol (het fundament van het team), superstars zoeken steile groei. Beoordeel beide op excellentie, maar dwing rockstars geen promotiepad op en houd superstars niet vast."},
{h:"4. Samen resultaten halen: de GSD-wielen", s:"Get Stuff Done draait via luisteren → verhelderen → debatteren → beslissen → overtuigen → uitvoeren → leren. Sla je stappen over (direct beslissen zonder debat), dan betaal je later in uitvoering en draagvlak."},
{h:"5-6. Relaties en begeleiding in de praktijk", s:"Concreet gereedschap: career conversations (drie gesprekken over levensverhaal, dromen en een 18-maandenplan), wekelijkse 1-op-1's die van de medewerker zijn, en feedback volgens situatie-gedrag-impact. Meet je eigen candor: vraag mensen je kritiek te beoordelen."},
{h:"7-8. Teamritme", s:"Staff meetings met vaste structuur, 'big debate'- en 'big decision'-meetings gescheiden, geen beslissingen in de wandelgang, en denk-tijd in de agenda's beschermen. Cultuur van candor onderhoud je in de kleine, dagelijkse interacties."}],
"Thanks for the Feedback": [
{h:"1. Drie triggers", s:"Feedback ontvangen is moeilijk omdat drie triggers de ontvangst blokkeren: waarheidstriggers ('dit klopt niet'), relatietriggers ('van jou pik ik dit niet') en identiteitstriggers ('dus ik deug niet'). De vaardigheid is de trigger herkennen en tóch het bruikbare vinden."},
{h:"2-3. Waarheid: soorten en labels", s:"We verwarren drie soorten feedback: waardering (ik zie je), coaching (zo word je beter) en beoordeling (hier sta je). Wie coaching verwacht en beoordeling krijgt, hoort niets meer. En feedback komt in vage labels ('wees proactiever'): vraag door naar de data eronder — wat zag je, wat bedoel je concreet?"},
{h:"4-5. Blinde vlekken", s:"Anderen zien wat jij niet ziet: je gezichtsuitdrukking, toon en patronen. Jouw intentie is voor jou zichtbaar, voor de ander alleen jouw impact. Zoek blinde-vlek-feedback actief: 'wat zie jij mij doen dat mij in de weg zit?'"},
{h:"6-7. Relatie: switchtracking en systemen", s:"Relatietriggers ontsporen gesprekken via 'switchtracking': de feedback ('je bent laat') wordt beantwoord met een ander onderwerp ('jij waardeert me nooit') — twee gesprekken door elkaar. Ontrafel ze expliciet. En kijk systemisch: veel 'jouw fout'-feedback beschrijft eigenlijk een botsing van twee rollen of gewoontes."},
{h:"8-9. Identiteit: bedrading en herkadering", s:"Mensen verschillen neurologisch in hoe hard feedback binnenkomt en hoe lang die nadreunt. Ontmantel vervormingen: één opmerking is geen totaaloordeel, nu is niet altijd. Een groei-identiteit ('ik ben iemand die leert') maakt feedback informatie in plaats van vonnis."},
{h:"10-12. Grenzen en het gesprek zelf", s:"Je mag feedback ook afwijzen — grenzen stellen aan wie en hoe — mits transparant. In het gesprek: open met het doel (welk soort feedback is dit?), luister, assert wat jij ziet, en stuur het proces. Eindig met kleine experimenten: probeer één advies veertien dagen."}],
"Multipliers": [
{h:"1. Het multiplier-effect", s:"Diminishers krijgen minder dan de helft uit hun mensen; multipliers vrijwel alles — een verdubbeling zonder één extra hire. Het verschil zit in aannames: 'zonder mij lukt het niet' versus 'mensen zijn slim en komen er wel uit'."},
{h:"2. Talent Magnet versus Empire Builder", s:"Multipliers trekken talent aan, zetten het op zijn 'native genius' in en laten het door- en uitstromen naar grotere rollen — waardoor nog meer talent komt. Empire builders verzamelen mensen als bezit en laten ze verpieteren."},
{h:"3. Liberator versus Tyrant", s:"Multipliers creëren ruimte waarin denken veilig is én excellentie vereist: ze geven 'permission to fail' op experimenten en eisen het beste werk. Tirannen creëren spanning die mensen doet indekken; de sfeer bepaalt hoeveel brein er beschikbaar is."},
{h:"4. Challenger versus Know-It-All", s:"Multipliers definiëren de uitdaging — groot, concreet, prikkelend — en laten het antwoord aan het team; know-it-alls demonstreren hun eigen kennis en iedereen wacht op hun mening. Stel de vraag die het team groter maakt dan jijzelf."},
{h:"5. Debate Maker versus Decision Maker", s:"Grote besluiten winnen aan kwaliteit en draagvlak door rigoureus debat: kader de vraag, eis bewijs, vraag ieders standpunt. Beslissers-in-hun-eentje krijgen organisaties die wachten en tweedegissen."},
{h:"6. Investor versus Micromanager", s:"Multipliers geven eigenaarschap ('jij hebt 51% van de stemmen'), investeren in middelen en coaching, en geven de pen terug als iemand hulp vraagt. Micromanagers springen in, redden en houden daarmee afhankelijkheid in stand — geef het probleem altijd terug."},
{h:"7. De accidental diminisher", s:"De gevaarlijkste diminisher is welwillend: de ideeënfontein die anderen overspoelt, de altijd-aan-leider, de redder, de snelle beslisser, de optimist die worsteling wegwuift. Vraag je team welke jij bent — en werk met 'extreme questions' en fiches om jezelf te doseren."},
{h:"8-9. Omgaan met diminishers en zelf groeien", s:"Onder een diminisher: word geen slachtoffer — verklein diens instinct door zelf vertrouwen te wekken, nodig hem gericht uit in plaats van af te weren. Zelf groeien: pak één discipline, één experiment van dertig dagen, en verwacht terugval — de aannames veranderen langzamer dan het gedrag."}],
"Dare to Lead": [
{h:"1. De arena betreden", s:"Moed en kwetsbaarheid horen bij elkaar: kwetsbaarheid is de emotie bij risico en onzekerheid — niet zwakte maar de toegangsprijs voor moedig leiderschap. Zonder kwetsbaarheid geen innovatie, geen moeilijke gesprekken, geen vertrouwen."},
{h:"2. Het harnas afleggen", s:"Zestien vormen van pantser blokkeren leiderschap: perfectionisme, cynisme, alwetendheid, macht óver in plaats van macht mét. Daartegenover 'daring leadership': nieuwsgierigheid, gronde zelfverzekerdheid (grounded confidence) en de regel 'clear is kind, unclear is unkind'."},
{h:"3. Schaamte en empathie", s:"Schaamte ('ik bén fout') verlamt, schuld ('ik déed iets fout') kan motiveren. Schaamtebestendige culturen vragen empathie: herkennen, benoemen, normaliseren. Leiders die met beschaming sturen, kopen stilte en risicomijding."},
{h:"4. Leven naar je waarden", s:"Kies je twee kernwaarden en operationaliseer ze: welk gedrag hoort erbij, welke 'slippery behaviors' verraden dat je afglijdt? Waarden zonder gedragsanker zijn decoratie; met anker worden ze een kompas voor moeilijke keuzes."},
{h:"5. BRAVING: vertrouwen in zeven delen", s:"Vertrouwen is opsplitsbaar en dus bespreekbaar: Boundaries, Reliability, Accountability, Vault (vertrouwelijkheid), Integrity, Non-judgment, Generosity. Gebruik het als gespreksinstrument: welk element schuurt tussen ons?"},
{h:"6. Leren opstaan", s:"Na falen: herken je eerste verhaal ('het verhaal dat ik mezelf vertel is...'), onderzoek wat echt waar is (de rumble) en schrijf een geleerde revolutie. Teams die vallen en opstaan trainen, durven meer — resilience vóóraf leren, niet pas na de crash."}],
"Turn the Ship Around!": [
{h:"1. De pijn van leader-follower", s:"Marquet erfde de slechtst presterende onderzeeboot van de vloot en ontdekte: een organisatie waarin iedereen wacht op bevelen, is precies zo slim als één persoon — de kapitein. Leader-follower was ontworpen voor spierwerk; kenniswerk vraagt leader-leader: leiders op elke stoel."},
{h:"2. Controle: bevoegdheid verplaatsen", s:"De kernmechanismen: 'I intend to...' (iedereen formuleert eigen besluiten plus rationale in plaats van toestemming te vragen), korte vroege gesprekken in plaats van lange controles achteraf, denk hardop, en weersta de drang om zelf antwoorden te geven. Vind de genetische code van controle en herschrijf hem."},
{h:"3. Competentie", s:"Bevoegdheid zonder kunde is roekeloos. Mechanismen: deliberate action (hardop benoemen wat je gaat doen voordat je handelt — de grootste foutreductie aan boord), continu leren overal, certificeren in plaats van briefen (vragen stellen in plaats van voorkauwen) en herhaal boodschappen consequent."},
{h:"4. Helderheid", s:"De derde pijler: iedereen moet het doel snappen om goed te beslissen. Mechanismen: begin met het einde voor ogen, gebruik richtinggevende principes die echt beslissingen sturen, erken direct en concreet gewenst gedrag, en begin met de vraag 'wat willen we bereiken?' in plaats van 'wat mogen we?'"},
{h:"5. De opbrengst", s:"De Santa Fe werd van slechtste de best beoordeelde boot en leverde uitzonderlijk veel latere kapiteins — het echte bewijs: leader-leader bouwt leiders die het systeem overleven. Excellentie ontstaat niet door fouten vermijden maar door uitmuntendheid najagen."}],
"The Five Dysfunctions of a Team": [
{h:"1. Afwezigheid van vertrouwen", s:"De basis van de piramide: kwetsbaarheidsvertrouwen — fouten, zwaktes en hulpvragen durven tonen. Zonder dat spelen teamleden politiek en verbergen ze onzekerheid. Bouwen: persoonlijke geschiedenissen delen, werkstijlen en sterktes bespreken, en een leider die als eerste kwetsbaar is."},
{h:"2. Angst voor conflict", s:"Zonder vertrouwen geen echt debat: teams vervallen in kunstmatige harmonie waar de echte discussies in de wandelgangen plaatsvinden. Productief ideeënconflict is nodig voor goede besluiten. Bouwen: conflict 'opgraven' (mining), toestemming geven om te schuren en live benoemen dat dit gezond is."},
{h:"3. Gebrek aan commitment", s:"Zonder debat geen gedragenheid: mensen committeren zich aan besluiten waarin ze gehoord zijn, ook zonder consensus (disagree and commit). Vaagheid is de vijand. Bouwen: elk overleg afsluiten met expliciete besluiten, deadlines en wat we naar buiten communiceren."},
{h:"4. Vermijden van aanspreekbaarheid", s:"Zonder commitment durft niemand elkaar aan te spreken op gedrag en prestaties — dat wordt naar de leider gedelegeerd, die daarmee bottleneck en boeman wordt. Bouwen: publieke doelen en standaarden, eenvoudige voortgangsreviews en de norm dat peers elkaar rechtstreeks aanspreken."},
{h:"5. Geen aandacht voor resultaten", s:"De top van de piramide: teamresultaat boven ego, status en eigen agenda. Teams die niet op collectief resultaat sturen, verliezen hun presteerders en hun bestaansrecht. Bouwen: één publiek scorebord met weinig indicatoren, en beloning gekoppeld aan teamuitkomsten."},
{h:"De fabel en het instrument", s:"Het verhaal van CEO Kathryn en haar disfunctionele MT laat de vijf lagen in actie zien: haar interventies — offsites, harde gesprekken, een vertrek — tonen dat teambuilding vooral discipline en moed is. Achterin: een zelfassessment per dysfunctie om met je eigen team te starten."}],
"Alive at Work": [
{h:"1. Het zoeksysteem", s:"Ons brein heeft een circuit dat oplicht bij exploreren, leren en betekenis — met dopamine als brandstof. Organisaties ontworpen op controle en herhaling zetten dit systeem uit en activeren het angstsysteem; wat volgt noemen we 'disengagement', maar het is neurologisch voorspelbaar gedrag."},
{h:"2-3. Angst versus spel", s:"Angst (voor beoordeling, voor fouten) versmalt denken en doodt experimenteerlust. Kleine prikkels voor het zoeksysteem — nieuwe taken, leerprojecten, experimenteerruimte — verhogen energie en prestaties meer dan bonussen. Leiders zijn de belangrijkste aan/uit-knop."},
{h:"4. Zelfexpressie en het beste zelf", s:"Mensen die bij onboarding hun 'beste zelf' beschrijven en die identiteit in hun werk mogen inzetten, blijven langer en presteren beter (het Wipro-experiment). Laat mensen hun sterktes en eigenheid in de rol leggen in plaats van ze in een mal te persen."},
{h:"5. Experimenteren", s:"Creëer 'speelruimtes': afgebakende zones waar proberen veilig is — prototypes, pilots, vrije verbeterprojecten. Serious play verlaagt de drempel: wie experimenteert als spel, leert sneller en deelt fouten eerder."},
{h:"6. Zingeving personaliseren", s:"Purpose werkt via persoonlijk contact met impact: één ontmoeting met de klant of eindgebruiker van je werk doet meer dan honderd missieposters. Help medewerkers hun eigen 'waarom' formuleren in plaats van het bedrijfswaarom te ondertekenen."},
{h:"7. De nederige leider", s:"Zoeksystemen floreren onder 'servant leaders' die vragen stellen, obstakels wegruimen en eer doorgeven. De leider die alles weet en controleert, krijgt een afdeling die wacht — de nederige leider een afdeling die zoekt."}],
"Why Do So Many Incompetent Men Become Leaders?": [
{h:"1-2. Het probleem", s:"De meeste leiders falen — kijk naar de betrokkenheids- en verloopcijfers — en de meerderheid is man. Chamorro-Premuzic draait de diversiteitsvraag om: het probleem is niet dat vrouwen de kenmerken van leiders missen, maar dat we op de verkeerde kenmerken selecteren."},
{h:"3. Zelfvertrouwen versus competentie", s:"De correlatie tussen zelfvertrouwen en competentie is zwak; toch lezen we zelfverzekerd optreden als kunde. Mannen overschatten zichzelf gemiddeld vaker, en overmoed wordt bij selectie beloond — de wortel van veel wanbenoemingen."},
{h:"4-5. Narcisme, psychopathie en charisma", s:"Donkere trekken helpen omhoog en falen daarna: narcisten domineren sollicitaties en beschadigen teams; charisma voorspelt aantrekkingskracht, niet effectiviteit. Volgers verwarren entertainment met leiderschap — vooral in crises, wanneer we redders zoeken."},
{h:"6-7. Wat wél voorspelt", s:"Goed leiderschap voorspel je met intellectueel vermogen, de juiste persoonlijkheid (emotionele stabiliteit, integriteit, nieuwsgierigheid) en vooral nederigheid en zelfinzicht. Vrouwen scoren op deze voorspellers gemiddeld iets beter — het 'female leadership advantage' dat selectiesystemen negeren."},
{h:"8. Leer je intuïtie wantrouwen", s:"De oplossing is niet vrouwen leren zich als overmoedige mannen te gedragen, maar de lat voor iedereen goed leggen: gevalideerde assessments, gestructureerde criteria, trackrecords van teams onder iemands leiding — en diepe scepsis bij kandidaten die vooral zichzelf goed verkopen."}],
"The Talent Delusion": [
{h:"1-2. De war for talent en wat talent is", s:"Organisaties zeggen om talent te vechten maar meten het amper. Werkbare definitie: talent is de combinatie van kunnen (vermogen), willen (motivatie) en passen (fit) — en volgt de 'vital few'-regel: een kleine groep levert een onevenredig deel van de output."},
{h:"3. Talent meten", s:"Wetenschappelijk gevalideerde instrumenten (cognitieve tests, persoonlijkheidsvragenlijsten, gestructureerde interviews) voorspellen prestaties aantoonbaar; zelfontworpen competentielijstjes en ongestructureerde gesprekken amper. Zelfbeoordeling is de slechtste bron: mensen kennen hun eigen talent slecht."},
{h:"4. Betrokkenheid", s:"Betrokkenheid en talent zijn verschillende assen: getalenteerd maar afgehaakt is een risicoprofiel, tevreden maar middelmatig ook. De grootste drijver van (dis)engagement is de directe leidinggevende — betrokkenheid is dus vooral een selectiecriterium voor managers."},
{h:"5. Ontwikkeling", s:"Coaching en ontwikkeling werken, maar bescheiden en vooral bij zelfinzicht: de grootste winst zit in mensen laten zien hoe ze op anderen overkomen (360-feedback, assessments). Ontwikkel rond iemands stabiele kern in plaats van persoonlijkheid te willen ombouwen."},
{h:"6. De donkere kant", s:"Iedereen heeft ontspoorrisico's (dark side traits) die onder stress opspelen: van arrogantie tot overmatige volgzaamheid. Screen erop bij selectie van leiders en maak ze bespreekbaar bij ontwikkeling — de duurste fouten komen van getalenteerde mensen met onbewaakte schaduwkanten."},
{h:"7. De toekomst van talent", s:"HR wordt datawetenschap: digitale sporen, AI-screening en people analytics kunnen selectie objectiever maken — of vooroordelen automatiseren. De opdracht: valideer alles, meet uitkomsten en behandel talentmanagement als wetenschap, niet als geloof."}],
"Co-Intelligence": [
{h:"1. Drie slapeloze nachten", s:"Wie serieus met moderne AI werkt, doorloopt een schok: het systeem doet dingen die niet zouden moeten kunnen. Mollick beschrijft hoe LLM's werken — voorspellen, niet begrijpen — en waarom ze toch als een vreemde, brede intelligentie functioneren die je alleen door gebruik leert kennen."},
{h:"2. De vier regels", s:"Regel één: nodig AI altijd uit aan tafel — probeer hem bij elke taak, anders leer je de grens nooit kennen. Regel twee: blijf de mens in de lus. Regel drie: behandel AI als een persoon (geef context, rol en voorbeelden), maar vergeet niet dat het er geen is. Regel vier: ga ervan uit dat dit de slechtste AI is die je ooit zult gebruiken."},
{h:"3. AI als persoon en de jagged frontier", s:"AI's kunnen verrassend goed zijn in complexe taken en falen op simpele — de grillige grens verschilt per model en per taak. Onderzoek bij consultants toont: wie binnen de grens werkt, wordt fors beter; wie erbuiten blind vertrouwt, gaat onderuit ('in slaap vallen achter het stuur')."},
{h:"4. AI als creatief", s:"LLM's zijn sterk in idee-generatie, variatie en herschrijven — in tests verslaan ze de meeste mensen op standaard creativiteitstaken. Gebruik AI voor volume en diversiteit aan ideeën, en jezelf voor smaak, selectie en de laatste stap."},
{h:"5. AI als collega", s:"Taken verdelen langs de grens: 'centaur'-werk (strikte taakverdeling mens/AI) en 'cyborg'-werk (continu verweven). Delegeer wat AI goed kan, houd wat betekenis geeft — en waak voor het uithollen van de leercurve van junioren, die juist van routinetaken leerden."},
{h:"6. AI als tutor en coach", s:"Onderwijs verandert fundamenteel: huiswerk is dood, maar één-op-één-tutoring — het effectiefste leermiddel dat we kennen — wordt eindelijk schaalbaar. Voor professionals: gebruik AI als oefenpartner, uitlegger en feedbackgever."},
{h:"7. Vier scenario's", s:"Mollick sluit af met vier toekomsten — van stagnatie tot exponentiële groei — en de nuchtere conclusie: in elk scenario behalve stilstand verandert werk ingrijpend. De opdracht is niet voorspellen maar aanpassingsvermogen organiseren, nu."}],
"Human + Machine": [
{h:"Deel 1. AI in het hart van processen", s:"Van fabriek tot backoffice tot R&D en marketing: de winnaars automatiseren geen oude processen maar herontwerpen ze rond zelflerende systemen. AI wordt een nieuwe productiefactor die processen adaptief maakt in plaats van sneller-hetzelfde."},
{h:"Deel 2a. De missing middle: mensen helpen machines", s:"Drie nieuwe menselijke rollen: trainers (leren AI taal, toon en oordeel), explainers (leggen algoritmische besluiten uit aan business en toezichthouders) en sustainers (bewaken prestaties, eerlijkheid en onbedoelde effecten). Ook in HR ontstaan deze rollen zodra AI besluiten raakt."},
{h:"Deel 2b. De missing middle: machines helpen mensen", s:"Andersom versterkt AI mensen: amplificatie (superkrachten voor analyse en creatie), interactie (agents die routinecommunicatie dragen) en belichaming (robots als collega's). De vraag per proces: welke combinatie levert wat geen van beide alleen kan?"},
{h:"Deel 2c. Fusion skills", s:"Acht nieuwe vaardigheden voor het AI-tijdperk, waaronder 'judgment integration' (weten wanneer je het model overrult), 'intelligent interrogation' (de juiste vragen aan systemen stellen) en 'reciprocal apprenticing' (AI trainen terwijl je ervan leert). Ontwikkelagenda's moeten hierop voorsorteren."},
{h:"Deel 2d. Leiderschap en verantwoorde AI", s:"Het MELDS-raamwerk: Mindset (herontwerp, niet automatiseer), Experimentatie, Leiderschap (verantwoorde AI als bestuurszaak), Data en Skills. Verantwoorde AI is operationeel werk: governance, bias-audits, uitlegbaarheid — geen bijlage bij de strategie."}],
"Prediction Machines": [
{h:"1. Goedkope voorspelling", s:"Zie AI economisch: machine learning verlaagt de prijs van één ding — voorspellen (informatie die je hebt omzetten in informatie die je mist). Als iets goedkoop wordt, gebruik je er meer van, op steeds meer plekken; en de complementen (data, oordeel) worden waardevoller."},
{h:"2. Waarom nu, en wat is anders", s:"Machine learning voorspelt beter dan klassieke statistiek omdat het complexe patronen in grote data vindt — maar het blijft correlatie: het faalt bij zeldzame gebeurtenissen en veranderende werelden. Weet wat je machine niet weet."},
{h:"3. De anatomie van een beslissing", s:"Elke beslissing ontleedt in voorspelling, oordeel (wat is elke uitkomst ons waard?), actie en feedback. AI pakt de voorspelling; het oordeel — inclusief de kosten van fout-positieven en fout-negatieven — blijft mensenwerk en wordt juist belangrijker."},
{h:"4. Workflows en taken", s:"Implementeer AI door werkstromen in taken te ontleden en per taak te bepalen waar voorspelling waarde toevoegt. Soms verandert één betere voorspelling de hele workflow — denk aan wat 'vertaal dit' deed met vertaalbureaus."},
{h:"5. Strategie", s:"Als voorspelling goed genoeg wordt, kantelen businessmodellen (Amazons hypothetische 'ship then shop'). Voor de C-suite: bepaal waar betere voorspelling je kernafweging verandert, investeer in data als strategisch bezit en accepteer leren-door-doen boven wachten op perfectie."},
{h:"6. Maatschappij en risico's", s:"De afwegingen zijn politiek: productiviteit versus verdeling, prestaties versus privacy, en machtsconcentratie bij wie de data heeft. Bedrijven die nu blind optimaliseren, kopen later reguleringsrisico."}],
"Power and Prediction": [
{h:"1. De tussentijd", s:"We leven tussen de demonstratie van AI's kracht en de brede realisatie ervan — zoals elektriciteit rond 1900: bewezen technologie, nog geen herontworpen fabrieken. Puntoplossingen (een bestaande taak verbeteren) zijn pas het begin; systeemoplossingen veranderen het spel."},
{h:"2. Regels versus beslissingen", s:"Organisaties draaien op regels — bevroren beslissingen die cognitieve last besparen maar informatie negeren. Goedkope voorspelling maakt het rendabel regels te ontdooien tot echte, gepersonaliseerde beslissingen. Zoek de regels ('zo doen we dat hier') die alleen bestaan omdat voorspellen duur was."},
{h:"3. Systeemdenken", s:"Beslissingen hangen samen: één AI-beslissing verbeteren verplaatst het knelpunt. Echte waarde vraagt herontwerp van hele beslissingssystemen — zoals schoolroosters, ziekenhuislogistiek of personeelsplanning — waarin nieuwe informatie door de keten stroomt."},
{h:"4. Macht", s:"Voorspellingsmacht herverdeelt: wie het model bezit wint invloed, wie op ervaring en regels leunde verliest. Binnen organisaties verschuiven beslissingsrechten; tussen organisaties ontstaan nieuwe poortwachters. Machtsvragen zijn dus ontwerpvragen, geen bijeffect."},
{h:"5. Hoe disruptie hier werkt", s:"Gevestigde partijen winnen bij puntoplossingen (zij hebben de data en processen), maar systeemoplossingen komen vaak van buiten omdat insiders hun eigen architectuur beschermen. De les: kannibaliseer je eigen regels voordat een ander het doet."},
{h:"6. Bouwen in de tussentijd", s:"Praktische agenda: inventariseer beslissingen en hun bevroren regels, experimenteer waar fouten goedkoop zijn, bouw de datafundamenten en bereid de organisatie voor op herverdeelde rollen — wie nu leert, plukt de systeemfase."}],
"Competing in the Age of AI": [
{h:"1-2. Het nieuwe bedrijf", s:"Ant Financial bedient miljarden klanten met een fractie van het personeel van een bank: als algoritmes het operationele hart vormen, ontkoppelt waarde van personeelsomvang. Het bedrijf wordt een beslissingsfabriek waarvan software de kritieke processen draait."},
{h:"3. De AI-fabriek", s:"Vier componenten: datapijplijn, algoritme-ontwikkeling, experimenteerplatform (permanent A/B-testen) en infrastructuur. Doel: van data naar voorspelling naar beslissing naar actie in een gesloten leerlus — de organisatie leert per transactie."},
{h:"4-5. Operating model en strategie", s:"Digitale operating models doorbreken de klassieke afruil tussen schaal, scope en leren: software schaalt zonder wachtrijen, deelt data over domeinen en verbetert al doende. Strategie draait om netwerk- en leereffecten: waar versterkt elke gebruiker de waarde voor de volgende?"},
{h:"6. Botsingen", s:"Als een AI-gedreven model een traditionele markt binnenkomt (Amazon in retail, fintech in bankieren), verliest het traditionele model structureel: het kan niet meegroeien in leersnelheid. Antwoord: zelf herbouwen rond data, niet efficiënter worden in het oude."},
{h:"7-8. Transformatie en leiderschap", s:"Transformatie is architectuurwerk: silo's en verouderde systemen vervangen door een geïntegreerd datafundament — Microsofts ommekeer als voorbeeld. Leiderschap verschuift naar het stellen van richting, ethiek en het bewaken van de leerlussen; digitale schaal brengt ook digitale verantwoordelijkheid (bias, privacy, systeemrisico)."}],
"The Algorithm": [
{h:"1. CV-scanners", s:"Schellmann test resumé-screeners en vindt willekeur: systemen die scoren op woorden als 'honkbal', kandidaten afwijzen om lay-out, en getrainde bias reproduceren (het beruchte Amazon-model dat vrouwen afwaardeerde). Veel afwijzingen zijn niet uitlegbaar — ook niet door de leverancier."},
{h:"2. Video-interviews en emotie-AI", s:"Eenzijdige video-interviews met gezichts- en stemanalyse claimen persoonlijkheid en geschiktheid te meten; onafhankelijke tests tonen dat scores veranderen door een bril, een accent of de achtergrond. De wetenschappelijke basis van emotieherkenning is wankel."},
{h:"3. Spelletjes en persoonlijkheidstests", s:"Game-based assessments en persoonlijkheidstests worden ingezet zonder validatie voor de functie; ze raken bovendien mensen met een beperking onevenredig. De vraag die zelden gesteld wordt: voorspelt deze score daadwerkelijk werkprestatie?"},
{h:"4. Sociale media en achtergrondchecks", s:"AI-tools die kandidaten scoren op hun online sporen vermengen werk en privé en leunen op proxies die discriminatie maskeren. Wat juridisch niet gevraagd mag worden, wordt algoritmisch afgeleid."},
{h:"5. Monitoring op het werk", s:"Productiviteitsscores, e-mailanalyse en 'flight risk'-voorspellingen volgen medewerkers continu; de scores zijn vaak context-blind en sturen managers naar schijnzekerheid. Surveillance verandert bovendien gedrag en vertrouwen — de meetlat vervormt wat hij meet."},
{h:"6. Ontslag per algoritme", s:"Als algoritmes mee-beslissen over wie eruit gaat, stapelen de fouten: ondoorzichtige criteria, geen beroep, en juridische aansprakelijkheid die gewoon bij de werkgever blijft liggen. 'Het systeem zei het' is geen verdediging."},
{h:"7. Wat te doen", s:"Schellmanns agenda voor werkgevers: eis validatiestudies en onafhankelijke audits, test tools zelf adversarieel, geef kandidaten uitleg en een menselijke beroepsroute, en houd mensen verantwoordelijk voor elk besluit. Regelgeving (EU AI Act, NYC-auditwet) maakt dit hoe dan ook verplicht."}],
"Weapons of Math Destruction": [
{h:"1. Wat is een model?", s:"Elk model is een vereenvoudiging met ingebakken keuzes en doelen — een mening in wiskunde. O'Neil contrasteert honkbalstatistiek (transparant, met feedback) met het model dat goede leraren ontsloeg op ondeugdelijke scores: zelfde techniek, tegengestelde ethiek."},
{h:"2. De anatomie van een WMD", s:"Drie kenmerken maken een model destructief: ondoorzichtigheid (de beoordeelde snapt de score niet), schaal (één fout raakt miljoenen) en schade (de score bepaalt levens). Plus de giftige lus: het model creëert de werkelijkheid die zijn aannames bevestigt."},
{h:"3-4. Rankings en reclame", s:"De US News-collegeranking dwong universiteiten tot gaming en kostenexplosie — een proxy die het doel opat. Predatory advertising gebruikt dezelfde voorspellingskracht om kwetsbare mensen te vinden en uit te buiten: targeting is moreel neutraal, het doelwit niet."},
{h:"5-6. Justitie en werk", s:"Recidive-scores straffen postcode en armoede mee; predictive policing stuurt patrouilles naar waar eerder data was — en oogst zo zijn eigen bevestiging. Op de arbeidsmarkt filteren persoonlijkheidstests en cv-scanners massaal, met dezelfde ondoorzichtigheid en zonder feedbackloop: wie onterecht is afgewezen, blijft onzichtbaar."},
{h:"7-8. Roosters, krediet en verzekering", s:"Scheduling-software optimaliseert loonkosten en versplintert levens van werknemers; e-scores en verzekeringsmodellen laten je buren en koopgedrag je prijs bepalen. Efficiëntie voor het bedrijf, willekeur voor het individu."},
{h:"9-10. Democratie en het antwoord", s:"Micro-targeting fragmenteert het publieke debat. O'Neils remedie: modelleurs een eed, verplichte audits, transparantie over data en criteria, en modellen expliciet toetsen op eerlijkheid — want eerlijkheid komt er niet vanzelf in, die moet je erin ontwerpen."}],
"Invisible Women": [
{h:"Deel 1. Het dagelijks leven", s:"Van sneeuwruimschema's (eerst autowegen, dan voetpaden — waar meer vrouwen lopen) tot openbare toiletten: 'neutrale' ontwerpen bedienen het mannelijke default-lichaam en -leven. De data over vrouwenlevens is er vaak simpelweg niet."},
{h:"Deel 2. De werkplek", s:"De mythe van meritocratie: promotiecriteria rond zichtbaarheid en beschikbaarheid, kantoortemperaturen op het mannelijk metabolisme, PBM's en gereedschap op mannenmaten. De grootste factor: onbetaalde zorgarbeid, die 'flexibiliteit' tot vrouwenprobleem maakt in plaats van ontwerpvraag."},
{h:"Deel 3. Ontwerp en technologie", s:"Crashtest-dummies op het mannenlichaam maken auto's aantoonbaar onveiliger voor vrouwen; spraakherkenning en medische AI getraind op mannendata presteren slechter voor vrouwen. Dataleemtes worden productgebreken — en algoritmes schalen ze op."},
{h:"Deel 4. Naar de dokter", s:"Vrouwen zijn ondervertegenwoordigd in medisch onderzoek; hartaanvallen bij vrouwen worden gemist omdat 'atypische' symptomen eigenlijk niet-mannelijke symptomen zijn. Sekse-uitgesplitste data is letterlijk levensreddend."},
{h:"Deel 5-6. Publiek leven en rampen", s:"Van belastingstelsels tot rampenrespons: beleid zonder uitgesplitste data pakt systematisch ongelijk uit. De rode draad voor elke organisatie: verzamel en splits data uit, betrek diverse gebruikers bij ontwerp, en behandel 'de standaardgebruiker' als de bias die hij is."}],
"The Second Machine Age": [
{h:"1-3. De tweede helft van het schaakbord", s:"Exponentiële groei misleidt: decennialang lijkt er weinig te gebeuren en dan ineens alles (zelfrijdende auto's, taalverwerking). Moore's law plus digitalisering plus recombinatie van bestaande bouwstenen drijft een versnelling die intuïtie structureel onderschat."},
{h:"4-6. Digitale economie", s:"Digitale goederen zijn gratis te kopiëren, direct wereldwijd te verspreiden en combineerbaar — de economie van overvloed. Innovatie is steeds vaker recombinatie: bestaande technologieën in nieuwe verbanden, versneld door meer verbonden geesten."},
{h:"7-9. Bounty en spread", s:"De koek groeit (bounty) maar de verdeling schever (spread): skill-biased verandering beloont hoogopgeleiden, kapitaal wint van arbeid, en wintner-takes-most-markten maken superstars extreem rijk terwijl de mediaan stagneert. Het gemiddelde verbergt de kloof."},
{h:"10-11. Racen mét de machine", s:"De vraag is niet mens óf machine: freestyle-schaak toonde dat mens-plus-machine met goed proces zelfs supercomputers verslaat. Menselijke troeven: ideeën genereren, breed patroonherkennen, complexe communicatie — vaardigheden die machines aanvullen in plaats van ermee concurreren."},
{h:"12-13. Aanbevelingen", s:"Voor individuen: leer wat complementair is aan machines. Voor beleid: onderwijs herontwerpen, ondernemerschap stimuleren, infrastructuur en onderzoek financieren, belasting herzien. De auteurs zijn techno-optimisten met een waarschuwing: technologie bepaalt niet de uitkomst, keuzes doen dat."}],
"The Coming Wave": [
{h:"1-2. Containment is het probleem", s:"Technologiegolven — van vuur tot internet — verspreiden zich altijd volledig: proliferatie is de geschiedenis, indamming de uitzondering. De komende golf (AI en synthetische biologie) is de machtigste ooit, en Suleymans kernvraag is of we haar kunnen besturen zonder haar te smoren."},
{h:"3-4. De golf zelf", s:"Vier kenmerken maken deze golf anders: asymmetrie (kleine actoren, groot effect), hyper-evolutie (verbetering in maanden), alomtegenwoordigheid en autonomie (technologie die zelf handelt). AI en biotech versterken elkaar en worden elk jaar goedkoper en toegankelijker."},
{h:"5-6. Waarom stoppen geen optie is", s:"De prikkels zijn onontkoombaar: geopolitieke wedloop, winst, onderzoeksprestige en echte maatschappelijke baten. Wie unilateraal stopt, verliest; dus verspreidt de golf zich — ongeacht wat één bedrijf of land beslist."},
{h:"7-9. Falende staten en de klem", s:"De golf zet de natiestaat onder druk: surveillance-autoritarisme aan de ene kant, chaos door machtige niet-statelijke actoren aan de andere. Het 'dilemma': zowel ongecontroleerde verspreiding als totale controle eindigt slecht — catastrofe of dystopie."},
{h:"10. Tien stappen naar containment", s:"Suleymans agenda: technische veiligheid, audits, chokepoints in de toeleveringsketen (chips), makers met verantwoordelijkheid, bedrijven met nieuwe governance, overheden met kennis en regels, internationale verdragen, en cultuur die zelfbeperking waardeert. Geen enkele stap volstaat; samen vormen ze een kans."}],
"The Future of the Professions": [
{h:"1. De grand bargain", s:"Professies kregen een maatschappelijk monopolie (licenties, titels, zelfregulering) in ruil voor betrouwbare toegang tot expertise. Dat verbond kraakt: expertise is duur, ongelijk verdeeld en ondoorzichtig — en technologie biedt voor het eerst een alternatief."},
{h:"2. Patronen over professies heen", s:"Van recht tot medicijnen tot accountancy zien de auteurs dezelfde bewegingen: standaardisering van routinewerk, zelfbedieningssystemen voor gebruikers, para-professionals die met systemen expertwerk doen, en online platforms die de poortwachter passeren."},
{h:"3. Theorie: kennis ontbundeld", s:"Professioneel werk ontleedt in taken; veel daarvan blijkt routiniseerbaar, ook waar professionals 'oordeel' claimen. Kennis doorloopt een productieproces (creëren, organiseren, toepassen, delen) en elk deel kan anders belegd worden — bij systemen, gemeenschappen of gebruikers zelf."},
{h:"4. Zeven nieuwe modellen", s:"Expertise stroomt straks via meerdere kanalen: de traditionele professional, netwerken van specialisten, para-professionals met systemen, machines die zelf adviseren, gemeenschappen van ervaringsdeskundigen, embedded kennis in producten, en gratis online kennis. Organisaties moeten kiezen welke modellen ze zelf bouwen."},
{h:"5. Bezwaren en de toekomst", s:"Tegen de klassieke bezwaren (kwaliteit! empathie! oordeel!) stellen de auteurs de empirische vraag: is de professional echt beter, of alleen vertrouwder? Hun slotsom: professionele kennis wordt bevrijd — en professies die zichzelf niet ontbundelen, worden ontbundeld."}],
"Superagency": [
{h:"1. Wat AI met handelingsvermogen doet", s:"Hoffman kadert het debat om: de vraag is niet of AI banen of waarheid bedreigt, maar of hij menselijke agency — het vermogen om je leven vorm te geven — vergroot of verkleint. Superagency is de toestand waarin AI-versterkte individuen ook de samenleving als geheel krachtiger maken."},
{h:"2. De eeuwige paniekcyclus", s:"Elke transformatieve technologie — drukpers, auto, internet — doorliep dezelfde fasen: doembeelden, roep om verbod, geleidelijke normalisering, onmisbaarheid. De les is niet dat kritiek onzin is, maar dat uitsluiting en verbod zelden de risico's beheersten en wel de baten vertraagden."},
{h:"3. Iteratieve uitrol", s:"Veiligheid ontstaat door gebruik: miljoenen gebruikers vinden fouten, randgevallen en misbruik sneller dan elk lab. Geleidelijk uitrollen, meten, bijsturen — de methode achter moderne AI-diensten — is volgens Hoffman zowel innovatie- als veiligheidsstrategie."},
{h:"4. Big knowledge", s:"Zoals de drukpers kennis democratiseerde, kan AI expertise democratiseren: juridisch advies, medische uitleg, onderwijs op maat voor wie het nooit kon betalen. De agency-winst zit vooral bij wie nu het minst toegang heeft."},
{h:"5. Wat kan misgaan", s:"Hoffman erkent de risico's — surveillance, manipulatie, machtsconcentratie — maar toetst elk aan hetzelfde criterium: welke aanpak maximaliseert agency? Transparantie en keuzevrijheid verslaan verbodsbepalingen; het gevaarlijkste scenario is dat alleen gesloten regimes de technologie vormen."},
{h:"6. Mensen als stuurlui", s:"De slotoproep: AI-beleid en AI-adoptie moeten participatief — mensen vormen de technologie door haar te gebruiken en bij te sturen, niet door erover te stemmen vanaf de zijlijn. Voor organisaties: maak medewerkers mede-ontwerpers van AI in hun werk."}],
"Reinventing Jobs": [
{h:"1. Deconstrueer", s:"Begin nooit bij de functie of de tool maar bij taken: ontleed de baan en typeer elke taak op drie assen — repetitief of variabel, zelfstandig of interactief, fysiek of mentaal. Deze typering bepaalt wat automatisering per taak kan en moet doen."},
{h:"2. Bepaal de opbrengstcurve", s:"Per taak verschilt wat beter presteren oplevert: bij sommige taken telt fouten elimineren (piloot: veilig is genoeg), bij andere levert elke verbetering exponentieel meer op (verkoper: de beste is goud waard). Automatiseer eerst waar foutreductie de winst is, versterk mensen waar de curve steil loopt."},
{h:"3. Kies de automatiseringsvorm", s:"Drie smaken: RPA voor repetitief regelwerk, cognitieve automatisering voor patroonherkenning en voorspelling, sociale robotica voor fysieke interactie. Elke vorm past bij andere taaktypes; de mismatch — cognitieve AI op variabel mensenwerk zetten — veroorzaakt de mislukkingen."},
{h:"4. Herontwerp het werk", s:"Na automatisering hergroepeer je de overblijvende en nieuwe menselijke taken tot rijkere rollen: meer variatie, meer klantcontact, meer oordeel. Herinvesteer de vrijgekomen tijd expliciet — anders verdampt de winst in meer van hetzelfde."},
{h:"5. De nieuwe rol van leiders en HR", s:"Management wordt continu werk-herontwerp: de vierstappencyclus jaarlijks draaien, medewerkers meenemen in wat verandert, en HR-instrumenten (functiehuizen, beloning, ontwikkeling) ombouwen naar taken en skills. Automatisering is nooit af; het is een operationeel ritme."}],
"The Algorithmic Leader": [
{h:"1. Werk terug vanuit de toekomst", s:"Vraag niet hoe je het huidige verbetert maar hoe het er over tien jaar uit zou moeten zien, en redeneer terug. Kijk naar de generatie die met algoritmes opgroeit — hun verwachtingen zijn je toekomstige norm."},
{h:"2. Mik op 10x, niet 10%", s:"Tien procent verbetering optimaliseert het oude; tien keer beter dwingt tot herontwerp. Multiplicatief denken vraagt de vraag: wat zouden we bouwen als we vandaag begonnen, zonder onze bestaande processen?"},
{h:"3. Denk computationeel", s:"Leiders hoeven niet te coderen maar wel te denken in systemen: problemen ontleden, patronen herkennen, abstraheren, en beslissen wat naar algoritmes kan en wat menselijk oordeel blijft."},
{h:"4. Omarm onzekerheid", s:"In complexe omgevingen werkt experimenteren beter dan plannen: portfolio's van kleine weddenschappen, snelle feedback, en comfort met 'we weten het nog niet'. Data ondersteunt beslissingen; het vervangt oordeel niet."},
{h:"5. Cultuur als besturingssysteem", s:"Algoritmische organisaties draaien op normen, niet op regels: autonomie binnen heldere principes, informatie die vrij stroomt, teams die zichzelf organiseren. De leider ontwerpt het OS in plaats van elke app."},
{h:"6. Werk niet — ontwerp werk", s:"De leider van de toekomst doet minder zelf en ontwerpt meer: wie doet wat, mens of machine, met welke informatie en welke beslissingsruimte. Delegeren wordt architectuur."},
{h:"7-8. Automatiseer en verhef, standaardiseer niet de mens", s:"Automatiseer het robotwerk en vergroot het menselijke deel (creativiteit, empathie, oordeel) in plaats van mensen tot verlengstuk van het systeem te maken. De Amazon-magazijnvraag — wordt de mens hier robot? — is de ethische lakmoesproef."},
{h:"9-10. Los op voor purpose, en vraag het een mens", s:"Algoritmes optimaliseren wat je ze geeft; leiders moeten bepalen wat het waard is om te optimaliseren — rechtvaardigheid, klantwelzijn, maatschappij. En bij twijfel over een algoritmisch besluit geldt het laatste principe: when in doubt, ask a human."}],
/*END-CHAPTERS*/
};

/* ============ app ============ */
const CATS = { fw: "HR & Future of Work", op: "Organisatiepsychologie", ai: "AI & HR" };
const LS_KEY = "boekvandedag-v1";

function loadState() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; }
}
function saveState(s) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch {}
}
let state = loadState();
state.read = state.read || {};
state.fav = state.fav || {};

/* deterministische volgorde: vaste seed, elke dag het volgende boek */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const ORDER = (() => {
  const idx = BOOKS.map((_, i) => i);
  const rnd = mulberry32(20260830);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx;
})();

function dayNum(d) {
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
}
const TODAY = dayNum(new Date());
function bookForDay(n) {
  const N = BOOKS.length;
  return BOOKS[ORDER[((n % N) + N) % N]];
}

let viewDay = TODAY;      /* welke dag toont de kaart */
let viewBook = null;      /* expliciet gekozen boek uit de bibliotheek (of null) */
let filter = "alle";
let query = "";

const fmt = new Intl.DateTimeFormat("nl-NL", { weekday: "long", day: "numeric", month: "long" });

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function bookId(b) { return b.t; }

function renderCard() {
  const b = viewBook || bookForDay(viewDay);
  const id = bookId(b);
  const isRead = !!state.read[id];
  const isFav = !!state.fav[id];
  const card = document.getElementById("card");
  card.innerHTML =
    '<div class="chiprow">' +
      '<span class="catchip ' + b.c + '">' + esc(CATS[b.c]) + '</span>' +
      (isRead ? '<span class="readmark">&#10003; gelezen</span>' : '') +
      (isFav ? '<span class="readmark" style="color:var(--gold)">&#9733; favoriet</span>' : '') +
    '</div>' +
    '<h1 class="booktitle">' + esc(b.t) + '</h1>' +
    '<p class="byline"><b>' + esc(b.a) + '</b> &middot; ' + b.y + '</p>' +
    '<p class="kern">' + esc(b.kern) + '</p>' +
    '<div class="cols">' +
      '<div><h2 class="seclabel">Kerninzichten</h2><ul class="plain inz">' +
        b.inz.map(i => '<li>' + esc(i) + '</li>').join("") + '</ul></div>' +
      '<div><h2 class="seclabel">Praktische tips</h2><ul class="plain tips">' +
        b.tips.map(t => '<li>' + esc(t) + '</li>').join("") + '</ul></div>' +
    '</div>' +
    (CHAPTERS[id] ? '<details class="hs"><summary>Hoofdstuk voor hoofdstuk</summary><div class="hsbody">' +
      CHAPTERS[id].map(c => '<div class="hsitem"><h3>' + esc(c.h) + '</h3><p>' + esc(c.s) + '</p></div>').join("") +
      '</div></details>' : '') +
    '<div class="actie"><span class="seclabel">Vandaag</span><p>' + esc(b.actie) + '</p></div>' +
    '<div class="cardfoot">' +
      '<button class="toggle" id="t-read" aria-pressed="' + isRead + '">' + (isRead ? "&#10003; Gelezen" : "Markeer als gelezen") + '</button>' +
      '<button class="toggle fav" id="t-fav" aria-pressed="' + isFav + '">' + (isFav ? "&#9733; Favoriet" : "&#9734; Favoriet") + '</button>' +
      (viewBook ? '<button class="backlink" id="t-back">Terug naar het boek van vandaag</button>' : '') +
    '</div>';

  document.getElementById("t-read").addEventListener("click", () => {
    if (state.read[id]) delete state.read[id]; else state.read[id] = true;
    saveState(state); renderAll();
  });
  document.getElementById("t-fav").addEventListener("click", () => {
    if (state.fav[id]) delete state.fav[id]; else state.fav[id] = true;
    saveState(state); renderAll();
  });
  const back = document.getElementById("t-back");
  if (back) back.addEventListener("click", () => { viewBook = null; viewDay = TODAY; renderAll(); });
}

function renderDateNav() {
  const dayL = document.getElementById("daylabel");
  const dateL = document.getElementById("datelabel");
  const next = document.getElementById("nextday");
  if (viewBook) {
    dayL.textContent = "Uit de bibliotheek";
    dateL.textContent = "";
    next.disabled = true;
    document.getElementById("prevday").disabled = true;
    return;
  }
  document.getElementById("prevday").disabled = false;
  const diff = TODAY - viewDay;
  dayL.textContent = diff === 0 ? "Vandaag" : diff === 1 ? "Gisteren" : diff + " dagen geleden";
  const d = new Date();
  d.setDate(d.getDate() - diff);
  dateL.textContent = fmt.format(d);
  next.disabled = viewDay >= TODAY;
}

function renderProgress() {
  const n = Object.keys(state.read).length;
  document.getElementById("progress").textContent = n + " van " + BOOKS.length + " gelezen";
}

function matches(b) {
  if (filter === "fav" && !state.fav[bookId(b)]) return false;
  if (filter === "gelezen" && !state.read[bookId(b)]) return false;
  if (["fw", "op", "ai"].includes(filter) && b.c !== filter) return false;
  if (query) {
    const q = query.toLowerCase();
    if (!b.t.toLowerCase().includes(q) && !b.a.toLowerCase().includes(q)) return false;
  }
  return true;
}

function renderLibrary() {
  const grid = document.getElementById("grid");
  const list = BOOKS.filter(matches);
  document.getElementById("libcount").textContent = list.length + " boeken";
  document.getElementById("empty").hidden = list.length > 0;
  grid.innerHTML = "";
  list.forEach(b => {
    const id = bookId(b);
    const el = document.createElement("button");
    el.className = "booklet";
    el.innerHTML =
      '<span class="t">' + esc(b.t) + '</span>' +
      '<span class="m"><span class="dot ' + b.c + '"></span>' + esc(b.a) +
        '<span class="marks">' + (state.fav[id] ? "&#9733;" : "") + (state.read[id] ? " &#10003;" : "") + '</span></span>';
    el.addEventListener("click", () => {
      viewBook = b;
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    grid.appendChild(el);
  });
}

function renderChips() {
  const defs = [["alle", "Alle"], ["fw", CATS.fw], ["op", CATS.op], ["ai", CATS.ai], ["fav", "★ Favorieten"], ["gelezen", "✓ Gelezen"]];
  const wrap = document.getElementById("chips");
  wrap.innerHTML = "";
  defs.forEach(([key, label]) => {
    const c = document.createElement("button");
    c.className = "chip";
    c.textContent = label;
    c.setAttribute("aria-pressed", String(filter === key));
    c.addEventListener("click", () => { filter = key; renderChips(); renderLibrary(); });
    wrap.appendChild(c);
  });
}

function renderAll() {
  renderDateNav();
  renderCard();
  renderProgress();
  renderLibrary();
}

document.getElementById("prevday").addEventListener("click", () => { viewBook = null; viewDay--; renderAll(); });
document.getElementById("nextday").addEventListener("click", () => { if (viewDay < TODAY) { viewBook = null; viewDay++; renderAll(); } });
document.getElementById("search").addEventListener("input", e => { query = e.target.value.trim(); renderLibrary(); });

renderChips();
renderAll();
</script>
</body>
</html>
