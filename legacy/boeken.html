/* ============ app ============ */
const CATS = { fw: "HR & Future of Work", op: "Organisatiepsychologie", ai: "AI & HR" };
const LS_KEY = "boekvandedag-v1";

function loadState() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; }
}
function saveState(s) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch {}
}
let state = loadState();
state.read = state.read || {};
state.fav = state.fav || {};

/* deterministische volgorde: vaste seed, elke dag het volgende boek */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const ORDER = (() => {
  const idx = BOOKS.map((_, i) => i);
  const rnd = mulberry32(20260830);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx;
})();

function dayNum(d) {
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
}
const TODAY = dayNum(new Date());
function bookForDay(n) {
  const N = BOOKS.length;
  return BOOKS[ORDER[((n % N) + N) % N]];
}

let viewDay = TODAY;      /* welke dag toont de kaart */
let viewBook = null;      /* expliciet gekozen boek uit de bibliotheek (of null) */
let filter = "alle";
let query = "";

const fmt = new Intl.DateTimeFormat("nl-NL", { weekday: "long", day: "numeric", month: "long" });

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function bookId(b) { return b.t; }

function renderCard() {
  const b = viewBook || bookForDay(viewDay);
  const id = bookId(b);
  const isRead = !!state.read[id];
  const isFav = !!state.fav[id];
  const card = document.getElementById("card");
  card.innerHTML =
    '<div class="chiprow">' +
      '<span class="catchip ' + b.c + '">' + esc(CATS[b.c]) + '</span>' +
      (isRead ? '<span class="readmark">&#10003; gelezen</span>' : '') +
      (isFav ? '<span class="readmark" style="color:var(--gold)">&#9733; favoriet</span>' : '') +
    '</div>' +
    '<h1 class="booktitle">' + esc(b.t) + '</h1>' +
    '<p class="byline"><b>' + esc(b.a) + '</b> &middot; ' + b.y + '</p>' +
    '<p class="kern">' + esc(b.kern) + '</p>' +
    '<div class="cols">' +
      '<div><h2 class="seclabel">Kerninzichten</h2><ul class="plain inz">' +
        b.inz.map(i => '<li>' + esc(i) + '</li>').join("") + '</ul></div>' +
      '<div><h2 class="seclabel">Praktische tips</h2><ul class="plain tips">' +
        b.tips.map(t => '<li>' + esc(t) + '</li>').join("") + '</ul></div>' +
    '</div>' +
    '<div class="actie"><span class="seclabel">Vandaag</span><p>' + esc(b.actie) + '</p></div>' +
    '<div class="cardfoot">' +
      '<button class="toggle" id="t-read" aria-pressed="' + isRead + '">' + (isRead ? "&#10003; Gelezen" : "Markeer als gelezen") + '</button>' +
      '<button class="toggle fav" id="t-fav" aria-pressed="' + isFav + '">' + (isFav ? "&#9733; Favoriet" : "&#9734; Favoriet") + '</button>' +
      (viewBook ? '<button class="backlink" id="t-back">Terug naar het boek van vandaag</button>' : '') +
    '</div>';

  document.getElementById("t-read").addEventListener("click", () => {
    if (state.read[id]) delete state.read[id]; else state.read[id] = true;
    saveState(state); renderAll();
  });
  document.getElementById("t-fav").addEventListener("click", () => {
    if (state.fav[id]) delete state.fav[id]; else state.fav[id] = true;
    saveState(state); renderAll();
  });
  const back = document.getElementById("t-back");
  if (back) back.addEventListener("click", () => { viewBook = null; viewDay = TODAY; renderAll(); });
}

function renderDateNav() {
  const dayL = document.getElementById("daylabel");
  const dateL = document.getElementById("datelabel");
  const next = document.getElementById("nextday");
  if (viewBook) {
    dayL.textContent = "Uit de bibliotheek";
    dateL.textContent = "";
    next.disabled = true;
    document.getElementById("prevday").disabled = true;
    return;
  }
  document.getElementById("prevday").disabled = false;
  const diff = TODAY - viewDay;
  dayL.textContent = diff === 0 ? "Vandaag" : diff === 1 ? "Gisteren" : diff + " dagen geleden";
  const d = new Date();
  d.setDate(d.getDate() - diff);
  dateL.textContent = fmt.format(d);
  next.disabled = viewDay >= TODAY;
}

function renderProgress() {
  const n = Object.keys(state.read).length;
  document.getElementById("progress").textContent = n + " van " + BOOKS.length + " gelezen";
}

function matches(b) {
  if (filter === "fav" && !state.fav[bookId(b)]) return false;
  if (filter === "gelezen" && !state.read[bookId(b)]) return false;
  if (["fw", "op", "ai"].includes(filter) && b.c !== filter) return false;
  if (query) {
    const q = query.toLowerCase();
    if (!b.t.toLowerCase().includes(q) && !b.a.toLowerCase().includes(q)) return false;
  }
  return true;
}

function renderLibrary() {
  const grid = document.getElementById("grid");
  const list = BOOKS.filter(matches);
  document.getElementById("libcount").textContent = list.length + " boeken";
  document.getElementById("empty").hidden = list.length > 0;
  grid.innerHTML = "";
  list.forEach(b => {
    const id = bookId(b);
    const el = document.createElement("button");
    el.className = "booklet";
    el.innerHTML =
      '<span class="t">' + esc(b.t) + '</span>' +
      '<span class="m"><span class="dot ' + b.c + '"></span>' + esc(b.a) +
        '<span class="marks">' + (state.fav[id] ? "&#9733;" : "") + (state.read[id] ? " &#10003;" : "") + '</span></span>';
    el.addEventListener("click", () => {
      viewBook = b;
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    grid.appendChild(el);
  });
}

function renderChips() {
  const defs = [["alle", "Alle"], ["fw", CATS.fw], ["op", CATS.op], ["ai", CATS.ai], ["fav", "★ Favorieten"], ["gelezen", "✓ Gelezen"]];
  const wrap = document.getElementById("chips");
  wrap.innerHTML = "";
  defs.forEach(([key, label]) => {
    const c = document.createElement("button");
    c.className = "chip";
    c.textContent = label;
    c.setAttribute("aria-pressed", String(filter === key));
    c.addEventListener("click", () => { filter = key; renderChips(); renderLibrary(); });
    wrap.appendChild(c);
  });
}

function renderAll() {
  renderDateNav();
  renderCard();
  renderProgress();
  renderLibrary();
}

document.getElementById("prevday").addEventListener("click", () => { viewBook = null; viewDay--; renderAll(); });
document.getElementById("nextday").addEventListener("click", () => { if (viewDay < TODAY) { viewBook = null; viewDay++; renderAll(); } });
document.getElementById("search").addEventListener("input", e => { query = e.target.value.trim(); renderLibrary(); });

renderChips();
renderAll();
</script>
</body>
</html>
